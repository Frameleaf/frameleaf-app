global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: frameleaf_api
    static_configs:
      - targets: ['frameleaf-server:8081']

  - job_name: frameleaf_microservices
    static_configs:
      - targets: ['frameleaf-server:8082']

  - job_name: frameleaf_ml
    static_configs:
      - targets: ['frameleaf-machine-learning:3003']
