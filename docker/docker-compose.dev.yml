#
# WARNING: To install Frameleaf, follow the guide in this release: docker/README.md
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/Frameleaf/frameleaf-app/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

# For development see:
# - https://help.frameleaf.ai/developer/setup
# - https://help.frameleaf.ai/developer/troubleshooting

name: immich-dev

services:
  immich-app-base:
    profiles: ["_base"]
    tmpfs:
      - /tmp
    volumes:
      - ..:/usr/src/app
      # - ../../ui:/usr/src/ui
      - build_cache:/buildcache
      - server_node_modules:/usr/src/app/server/node_modules
      - web_node_modules:/usr/src/app/web/node_modules
      - github_node_modules:/usr/src/app/.github/node_modules
      - cli_node_modules:/usr/src/app/packages/cli/node_modules
      - docs_node_modules:/usr/src/app/docs/node_modules
      - e2e_node_modules:/usr/src/app/e2e/node_modules
      - sdk_node_modules:/usr/src/app/packages/sdk/node_modules
      - app_node_modules:/usr/src/app/node_modules
      - sveltekit:/usr/src/app/web/.svelte-kit
      - coverage:/usr/src/app/web/coverage

  immich-init:
    extends:
      service: immich-app-base
    profiles: !reset []
    container_name: frameleaf_init
    image: frameleaf-server-dev:local
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command:
      - |
        mise install
        touch /tmp/init-complete
        exec tail -f /dev/null
    volumes:
      - build_cache:/buildcache
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init-complete"]
      interval: 2s
      timeout: 3s
      retries: 300
      start_period: 300s

  immich-server:
    extends:
      service: immich-app-base
    profiles: !reset []
    container_name: frameleaf_server
    command: ["immich-dev"]
    image: frameleaf-server-dev:local
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION}/photos:/data
      - /etc/localtime:/etc/localtime:ro
      - ../packages/plugin-core:/build/plugins/immich-plugin-core
    env_file:
      - .env
    environment:
      IMMICH_REPOSITORY: Frameleaf/frameleaf-app
      IMMICH_REPOSITORY_URL: https://github.com/Frameleaf/frameleaf-app
      IMMICH_SOURCE_REF: local
      IMMICH_SOURCE_COMMIT: ""
      IMMICH_SOURCE_URL: https://github.com/Frameleaf/frameleaf-app
      IMMICH_BUILD: ""
      IMMICH_BUILD_URL: https://github.com/Frameleaf/frameleaf-app/actions
      IMMICH_BUILD_IMAGE: development
      IMMICH_BUILD_IMAGE_URL: https://github.com/Frameleaf/frameleaf-app/pkgs/container/frameleaf-server
      IMMICH_THIRD_PARTY_SOURCE_URL: https://github.com/Frameleaf/frameleaf-app/
      IMMICH_THIRD_PARTY_BUG_FEATURE_URL: https://github.com/Frameleaf/frameleaf-app/issues
      IMMICH_THIRD_PARTY_DOCUMENTATION_URL: https://github.com/Frameleaf/frameleaf-app/tree/fork/main/docs
      IMMICH_THIRD_PARTY_SUPPORT_URL: https://github.com/Frameleaf/frameleaf-app/issues
      IMMICH_HELMET_FILE: "true"
    ports:
      - 9230:9230
      - 9231:9231
      - 2283:2283
    depends_on:
      immich-init:
        condition: service_healthy
      redis:
        condition: service_started
      database:
        condition: service_started
    healthcheck:
      disable: false

  immich-web:
    extends:
      service: immich-app-base
    profiles: !reset []
    container_name: frameleaf_web
    image: frameleaf-web-dev:local
    build:
      context: ../
      dockerfile: server/Dockerfile.dev
      target: dev
    command: ["immich-web"]
    env_file:
      - .env
    ports:
      - 3000:3000
      - 24678:24678
    restart: unless-stopped
    depends_on:
      immich-init:
        condition: service_healthy
      immich-server:
        condition: service_started

  immich-machine-learning:
    container_name: frameleaf_machine_learning
    image: frameleaf-machine-learning-dev:local
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      target: prod
      args:
        - DEVICE=cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    ports:
      - 3003:3003
    volumes:
      - ../machine-learning/immich_ml:/usr/src/immich_ml
      - model_cache:/cache
    env_file:
      - .env
    depends_on:
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: frameleaf_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    container_name: frameleaf_postgres
    image: frameleaf-postgres:local
    # Built from Frameleaf's own Postgres image source (docker/postgres).
    build:
      context: ./postgres
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${UPLOAD_LOCATION}/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  model_cache:
  build_cache:
  server_node_modules:
  web_node_modules:
  github_node_modules:
  cli_node_modules:
  docs_node_modules:
  e2e_node_modules:
  sdk_node_modules:
  app_node_modules:
  sveltekit:
  coverage:
