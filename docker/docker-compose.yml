#
# WARNING: To install Frameleaf, follow the guide in this release: docker/README.md
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/Frameleaf/frameleaf-app/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

# Stacks created by Frameleaf 1.1.12 or earlier run as project "immich": keep it by adding
# COMPOSE_PROJECT_NAME=immich to .env, so Compose reuses the same containers, network and volumes.
name: frameleaf

services:
  frameleaf-server:
    container_name: frameleaf_server
    image: ghcr.io/frameleaf/frameleaf-server:${FRAMELEAF_VERSION:-${IMMICH_VERSION:-latest}}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # FL-408: the bundled Studio worker's enrolment, shared read-only with machine learning
      - studio-worker:/run/frameleaf/studio-worker
    env_file:
      - .env
    ports:
      - "${FRAMELEAF_HOST_PORT:-2283}:2283"
      # Frameleaf Cloud remote access: the direct HTTPS listener (LAN names and direct connections)
      - "${FRAMELEAF_HOST_HTTPS_PORT:-2443}:2443"
    depends_on:
      database:
        condition: service_healthy
    restart: always
    # FL-721: encrypted Locked files are decrypted into /dev/shm (RAM) for thumbnails, video and ML; Docker's
    # default 64 MB is too small for videos and RAW files. Lower it on a NAS with little memory.
    shm_size: 2gb
    # must exceed FRAMELEAF_SHUTDOWN_DEADLINE_SECONDS (9 s by default): running jobs finish or go back to waiting first
    stop_grace_period: 10s
    healthcheck:
      disable: false

  # Bonjour must use the host network to reach phones; the application and database remain isolated.
  frameleaf-lan-discovery:
    image: ghcr.io/frameleaf/frameleaf-server:${FRAMELEAF_VERSION:-${IMMICH_VERSION:-latest}}
    entrypoint: ["node", "/usr/src/app/server/bin/frameleaf-lan-discovery.mjs"]
    network_mode: host
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FRAMELEAF_DISCOVERY_URL: http://127.0.0.1:${FRAMELEAF_HOST_PORT:-2283}
    depends_on: [frameleaf-server]
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", ""]
      interval: 30s

  frameleaf-machine-learning:
    networks:
      default:
        aliases: [immich-machine-learning]
    container_name: frameleaf_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${FRAMELEAF_VERSION:-${IMMICH_VERSION:-latest}}-cuda
    image: ghcr.io/frameleaf/frameleaf-machine-learning:${FRAMELEAF_VERSION:-${IMMICH_VERSION:-latest}}
    # extends: # uncomment this section for hardware acceleration - see https://help.frameleaf.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
      # FL-408: the Studio render worker enrols from here (FRAMELEAF_STUDIO_WORKER=false turns it off)
      - studio-worker:/run/frameleaf/studio-worker:ro
    # Keep server credentials out of the inference worker.
    env_file:
      - path: .env.ml
        required: false
    restart: always
    healthcheck:
      disable: false

  database:
    container_name: frameleaf_postgres
    image: ghcr.io/frameleaf/frameleaf-postgres:19beta4-pgvector0.8.7@sha256:7b155ed85302ab66c1022309f1f70f0b79f98f70bd52af8d7d3611a0cbf08cf0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql
    shm_size: 128mb
    restart: always
    healthcheck:
      # Over TCP: during first-boot initdb the temporary server answers only on the socket, which
      # passed the image check and let the server connect before PostgreSQL listened.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --dbname=\"$${POSTGRES_DB}\" --username=\"$${POSTGRES_USER}\" && /usr/local/bin/healthcheck.sh"]
      interval: 30s
      start_period: 5m
      start_interval: 5s

volumes:
  model-cache:
  studio-worker:
