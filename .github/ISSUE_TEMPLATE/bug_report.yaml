name: Report an issue with Frameleaf
description: Report an issue with Frameleaf
body:
  - type: checkboxes
    attributes:
      label: I have searched the existing issues, both open and closed, to make sure this is not a duplicate report.
      options:
        - label: 'Yes'

  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        If you have a feature or enhancement request, please open a separate issue that describes it instead.

  - type: textarea
    validations:
      required: true
    attributes:
      label: The bug
      description: >-
        Describe the issue you are experiencing here, to communicate to the
        maintainers. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.

  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    validations:
      required: true
    attributes:
      label: The OS that the Frameleaf server is running on
      placeholder: Ubuntu 22.10, Debian, Arch...etc

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: Frameleaf server version
      placeholder: v3.2.0

  - type: dropdown
    id: client
    validations:
      required: true
    attributes:
      label: Where you see the issue
      options:
        - Server (no client involved)
        - Web app in a browser
        - Frameleaf native app (iOS or Android)
        - Frameleaf CLI
        - Another app connected to the server

  - type: input
    id: client-version
    attributes:
      label: Client version, browser or app
      description: For the web app, the browser and its version; for an app, its name and version.
      placeholder: Firefox 143, or Frameleaf for iOS 1.0.0

  - type: input
    attributes:
      label: Device make and model
      placeholder: Samsung S25 Android 16

  - type: textarea
    validations:
      required: true
    attributes:
      label: Your docker-compose.yml content
      render: YAML

  - type: textarea
    validations:
      required: true
    attributes:
      label: Your .env content
      description: Please provide the redacted .env content of your setup
      render: Shell

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: 'How do you trigger this bug? Please walk us through it step by step.'
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description:
        Please copy and paste any relevant logs below. (code formatting is
        enabled, no need for backticks)
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.

  - type: markdown
    attributes:
      value: Thank you for submitting the form
