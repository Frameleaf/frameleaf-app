name: Frameleaf Studio engine
'on':
  pull_request:
    branches: [fork/main]
    paths:
      - studio/**
      - web/src/lib/frameleaf/studio/**
      - scripts/frameleaf-studio-contracts.mjs
      - scripts/frameleaf-studio-rights.mjs
      - .github/workflows/frameleaf-studio-engine.yml
  push:
    branches: [fork/main]
    paths:
      - studio/**
      - web/src/lib/frameleaf/studio/**
      - scripts/frameleaf-studio-contracts.mjs
      - scripts/frameleaf-studio-rights.mjs
      - .github/workflows/frameleaf-studio-engine.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - name: Pin the isolated engine package manager
        run: npm install --global npm@11.8.0 --ignore-scripts --no-audit --no-fund
      - name: Verify recovery safeguards
        run: node --test studio/tools/engine.test.mjs
      - name: Recover and verify immutable source, then prepare adapted workspace
        run: node studio/tools/engine.mjs prepare
      - name: Graph allocation audit (FL-97)
        run: node studio/tools/allocation-audit.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix studio/engine ci --ignore-scripts --no-audit --no-fund
      - name: Install FFmpeg with libx265 for HDR master verification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx265
          ffmpeg -hide_banner -encoders | grep -q libsvtav1
      - name: HDR master metadata, refusals and HEVC Main10 round trip (FL-107)
        run: node --test studio/tools/hdr-master.test.mjs
      - name: Install Chromium for compositor readback
        working-directory: studio/engine
        run: npx --no-install playwright install --with-deps chromium
      - name: Render-worker hardware probe refuses software GPU evidence
        env:
          STUDIO_WORKER_PROBE_BROWSER_TEST: '1'
        run: node --test studio/tools/render-worker-probe.test.mjs studio/tools/render-worker-claim.test.mjs studio/tools/render-worker-image-inputs.test.mjs
      - name: Compositor float range and alpha regression (software WebGPU)
        env:
          FREECUT_CHROME_ARGS_REPLACE: --enable-unsafe-webgpu --use-angle=swiftshader --use-vulkan=swiftshader --enable-features=Vulkan
        run: |
          setsid npm --prefix studio/engine run dev -- --host 127.0.0.1 --port 5186 --strictPort > "$RUNNER_TEMP/studio-float-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5186/ > /dev/null; then break; fi
            sleep 1
          done
          node studio/tools/compositor-float.browser.mjs
          node studio/tools/transition-float.browser.mjs
          node studio/tools/nested-float.browser.mjs
          node studio/tools/chroma-key.browser.mjs
          EFFECTS_MATRIX_REPORT="$RUNNER_TEMP/effects-matrix-report.json" node studio/tools/effects-matrix.browser.mjs
          BLEND_MATRIX_REPORT="$RUNNER_TEMP/blend-matrix-report.json" node studio/tools/blend-matrix.browser.mjs
          TRANSITION_MATRIX_REPORT="$RUNNER_TEMP/transition-matrix-report.json" node studio/tools/transition-matrix.browser.mjs
          node studio/tools/color-output.browser.mjs
          node studio/tools/hdr-signal.browser.mjs
          node studio/tools/hdr-source.browser.mjs
          node studio/tools/hdr-master.browser.mjs
      # FL-112 (STU-405): record exactly which conformance.json chromium-axis cases this run's own
      # software-WebGPU browser matrix covers, from the reports the step above just wrote - not from
      # any developer machine's GPU. Fails the job (via the tracked-file diff) if conformance.json
      # wasn't regenerated after a coverage change, the same freshness-check shape used for the
      # OpenAPI client and other generated artifacts in this repo.
      - name: Record Studio browser-conformance evidence (FL-112)
        run: |
          node scripts/frameleaf-studio-evidence.mjs --family effect --report "$RUNNER_TEMP/effects-matrix-report.json" --write
          node scripts/frameleaf-studio-evidence.mjs --family blend --report "$RUNNER_TEMP/blend-matrix-report.json" --write
          node scripts/frameleaf-studio-evidence.mjs --family transition --report "$RUNNER_TEMP/transition-matrix-report.json" --write
          git diff --exit-code -- studio/conformance.json
      - name: Upstream unit and Node headless contracts
        run: |
          npm --prefix studio/engine run test:run
          npm --prefix studio/engine run headless:test:node
      - name: Build and attest the isolated engine
        run: |
          npm --prefix studio/engine run build
          node studio/tools/engine.mjs attest
          cp studio/engine/frameleaf-build.json "$RUNNER_TEMP/frameleaf-build-first.json"
      - name: Frameleaf adapter tests and editor build (FL-88, FL-92)
        run: |
          # The adapter compiles host modules from web/src, whose tsconfig extends the SvelteKit
          # config that `svelte-kit sync` generates. This job has no web workspace, so stand in for it.
          mkdir -p web/.svelte-kit
          test -f web/.svelte-kit/tsconfig.json || echo '{}' > web/.svelte-kit/tsconfig.json
          node studio/tools/adapter.mjs test
          node studio/tools/adapter.mjs build
          test -f web/static/studio-engine/manifest.json
          test -f web/static/studio-engine/notices/freecut.txt
      - name: Reproduce from a fresh generated workspace
        run: |
          rm -rf studio/engine
          node studio/tools/engine.mjs prepare
          npm --prefix studio/engine ci --ignore-scripts --no-audit --no-fund
          npm --prefix studio/engine run build
          node studio/tools/engine.mjs attest
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const first = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/frameleaf-build-first.json")); const second = JSON.parse(fs.readFileSync("studio/engine/frameleaf-build.json")); assert.deepEqual(second.artifacts, first.artifacts); assert.equal(second.artifactSha256, first.artifactSha256); assert.equal(second.sourceSha256, first.sourceSha256); console.log("Reproduced", second.artifactSha256);'
          node studio/tools/feature-manifest.mjs --check
      - name: Retain source, artifact and license evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-studio-engine-provenance
          path: |
            ${{ runner.temp }}/frameleaf-build-first.json
            studio/engine/frameleaf-source.json
            studio/engine/frameleaf-build.json
          if-no-files-found: error
