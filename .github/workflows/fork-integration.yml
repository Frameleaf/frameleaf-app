name: Fork integration

on:
  pull_request:
    branches: ['fork/main']
  workflow_call:
  workflow_dispatch:
    inputs:
      raw_engine:
        description: Execute actual native RAW camera qualification
        type: choice
        default: none
        options: [none, libraw, darktable]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate delivery workflow contracts
        run: |
          node .github/check-runners.cjs
          node .github/check-release.cjs
          node .github/check-jira.cjs
          node scripts/frameleaf-distribution-gates.mjs
          node --test docker/frameleaf-delivery.test.mjs
          node --test \
            .github/frameleaf-release.test.cjs \
            .github/frameleaf-deploy-test.test.cjs \
            .github/verify-release-bundle.test.cjs \
            scripts/frameleaf-distribution-gates.test.mjs
      - name: Validate NAS package fixtures
        run: node --test --test-concurrency=1 packaging/nas/build.test.cjs
      - name: Install plugin WASM, API generation and ffmpeg tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker create --name fork-integration-mise ghcr.io/jdx/mise:2026.9.9@sha256:a88f300ef4365494b88f8eefd271bb92ba467d4a41835739a714426207215730 /bin/true
          docker cp fork-integration-mise:/usr/local/bin/mise "$RUNNER_TEMP/mise"
          docker rm fork-integration-mise
          "$RUNNER_TEMP/mise" trust mise.toml
          "$RUNNER_TEMP/mise" install --locked node github:extism/js-pdk github:webassembly/binaryen npm:oazapfts github:jellyfin/jellyfin-ffmpeg
          {
            "$RUNNER_TEMP/mise" where github:extism/js-pdk
            echo "$("$RUNNER_TEMP/mise" where github:webassembly/binaryen)/bin"
            "$RUNNER_TEMP/mise" bin-paths npm:oazapfts
            # the server unit tests' byte-level clip checks (FL-162) run real ffmpeg and ffprobe
            "$RUNNER_TEMP/mise" bin-paths github:jellyfin/jellyfin-ffmpeg
          } >> "$GITHUB_PATH"
      - name: Check local Studio source preflight and exact frame timestamps
        run: node --test scripts/frameleaf-studio-preflight.test.mjs
      - name: Build SDK and core plugin WASM
        run: |
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/plugin-sdk build
          pnpm --filter @immich/plugin-core build
      - name: Verify generated API artifacts are tracked
        run: git ls-files --error-unmatch -- open-api/immich-openapi-specs.json packages/sdk/src/fetch-client.ts
      - name: Generate OpenAPI and TypeScript client
        id: api-generation
        run: |
          pnpm --filter immich build
          pnpm --filter immich exec node dist/bin/sync-open-api.js
          oazapfts --optimistic --argumentStyle=object --useEnumType --allSchemas open-api/immich-openapi-specs.json packages/sdk/src/fetch-client.ts
      - name: Retain generated API artifacts for source reconciliation
        if: ${{ steps.api-generation.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-api-${{ github.sha }}
          path: |
            open-api/immich-openapi-specs.json
            packages/sdk/src/fetch-client.ts
          if-no-files-found: error
      - name: Verify OpenAPI and TypeScript client freshness
        run: |
          git diff --exit-code -- open-api/immich-openapi-specs.json packages/sdk/src/fetch-client.ts
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/sdk test
      - name: Check server types and lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm --filter immich check
          pnpm --filter immich lint
      - name: Run server unit tests
        run: pnpm --filter immich test --run
      - name: Run server medium tests with local PostgreSQL containers
        run: pnpm --filter immich test:medium --run
      - name: Check web types and Svelte components
        run: |
          pnpm --filter immich-web exec svelte-kit sync
          pnpm --filter immich-web check:typescript
          pnpm --filter immich-web check:svelte
      - name: Check CLI and migration command
        run: |
          pnpm --filter @immich/cli check
          pnpm --filter @immich/cli lint
          pnpm --filter @immich/cli test --run
          pnpm --filter @immich/cli build
          node packages/cli/bin/immich migrate --help
      - name: Check end-to-end fixtures against generated clients
        run: pnpm --filter immich-e2e check
      - name: Run web unit tests
        run: pnpm --filter immich-web test --run

  machine-learning:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
          python-version: '3.12'
      - name: Install locked CPU test dependencies
        run: uv sync --frozen --extra cpu --group test --no-default-groups
      - name: Run ML unit tests without model downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MACHINE_LEARNING_TEST_FULL: 'false'
        run: .venv/bin/python -m pytest -q

  cli-fork-to-official:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @immich/sdk build && pnpm --filter @immich/cli build
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Migrate one asset and album from fork to certified official server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/test-cli-fork-to-official.mjs

  machine-learning-containers:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, cuda]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ML runtime with locked fork dependencies
        run: docker build --build-arg DEVICE=${{ matrix.device }} --target prod -t fork-ml-test machine-learning
      - name: Verify runtime imports without downloading models
        run: |
          docker run --rm --entrypoint python fork-ml-test -c 'import onnxruntime; import immich_ml.models.image_description'
      - name: Verify the CUDA image-description stack without a GPU
        if: matrix.device == 'cuda'
        run: |
          docker run --rm --entrypoint python fork-ml-test -c 'import torch; import torchvision; from transformers import AutoProcessor, Qwen2_5_VLForConditionalGeneration'

  native-raw:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.event_name == 'workflow_dispatch' && inputs.raw_engine != 'none'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            darktable_sha256: 867ba61fca41d614e6650fd92d6e7968d8c56a1d1dd2bbc3aa06b52508694ed6
          - runner: ubuntu-24.04-arm
            arch: aarch64
            darktable_sha256: 87088ada0a614c2c61c6bc663249388fe9e1d4b57689de3a5fd98c7af348d75d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the candidate's pinned LibRaw source and CLI
        if: inputs.raw_engine == 'libraw'
        working-directory: server/base-image/sources
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake build-essential jq libtool pkg-config liblcms2-dev libjpeg-dev zlib1g-dev
          sudo bash ./libraw.sh
      - name: Qualify actual RAW sensor output and preservation
        if: inputs.raw_engine == 'libraw'
        working-directory: server
        run: |
          node --input-type=module <<'JS'
          import { exiftool } from 'exiftool-vendored';
          import { spawnSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const fixtures = ['Canon/EOS_70D.CR2', 'Ricoh/GR3/Ricoh_GR3-450.DNG', 'Nikon/D80/glarus.nef'];
          try {
            for (const name of fixtures) {
              const file = resolve('../e2e/test-assets/formats/raw', name);
              const tags = await exiftool.read(file);
              let width = Number(tags.ImageWidth), height = Number(tags.ImageHeight);
              if (!Number.isSafeInteger(width) || !Number.isSafeInteger(height) || width < 1000 || height < 1000) throw new Error('Missing full-frame fixture dimensions');
              if ([5, 6, 7, 8].includes(Number(tags.Orientation)) || /90|270/.test(String(tags.Orientation))) [width, height] = [height, width];
              const result = spawnSync(process.execPath, ['--experimental-transform-types', 'base-image/verify-raw.mjs', file, String(width), String(height), 'src/utils/raw-renderer.ts'], { stdio: 'inherit' });
              if (result.error || result.status !== 0) throw result.error ?? new Error('Native RAW qualification failed: ' + name);
            }
          } finally { await exiftool.end(); }
          JS
      - name: Install the hash-pinned darktable release for qualification
        if: inputs.raw_engine == 'darktable'
        env:
          DT_ARCH: ${{ matrix.arch }}
          DT_SHA256: ${{ matrix.darktable_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/darktable"
          cd "$RUNNER_TEMP/darktable"
          curl --fail --location "https://github.com/darktable-org/darktable/releases/download/release-5.6.1/Darktable-5.6.1-${DT_ARCH}.AppImage" --output darktable.AppImage
          echo "$DT_SHA256  darktable.AppImage" | sha256sum --check -
          chmod +x darktable.AppImage
          ln -s darktable.AppImage darktable-cli
          echo "$RUNNER_TEMP/darktable" >> "$GITHUB_PATH"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - name: Build the local plugin SDK required by native media tests
        if: inputs.raw_engine == 'darktable'
        run: |
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/plugin-sdk build
      - name: Qualify actual native history, exposure and export pipeline
        if: inputs.raw_engine == 'darktable'
        working-directory: server
        run: pnpm exec vitest run --config test/vitest.config.darktable.mjs
