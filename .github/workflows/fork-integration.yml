name: Fork integration

on:
  pull_request:
    branches: ['fork/main']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate delivery workflow contracts
        run: |
          node .github/check-runners.cjs
          node .github/check-release.cjs
          node .github/check-jira.cjs
          node --test docker/frameleaf-delivery.test.mjs
          node --test .github/frameleaf-release.test.cjs
      - name: Install plugin WASM and API generation tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker create --name fork-integration-mise ghcr.io/jdx/mise:2026.9.9@sha256:a88f300ef4365494b88f8eefd271bb92ba467d4a41835739a714426207215730 /bin/true
          docker cp fork-integration-mise:/usr/local/bin/mise "$RUNNER_TEMP/mise"
          docker rm fork-integration-mise
          "$RUNNER_TEMP/mise" trust mise.toml
          "$RUNNER_TEMP/mise" install --locked node github:extism/js-pdk github:webassembly/binaryen npm:oazapfts
          {
            "$RUNNER_TEMP/mise" where github:extism/js-pdk
            echo "$("$RUNNER_TEMP/mise" where github:webassembly/binaryen)/bin"
            "$RUNNER_TEMP/mise" bin-paths npm:oazapfts
          } >> "$GITHUB_PATH"
      - name: Build SDK and core plugin WASM
        run: |
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/plugin-sdk build
          pnpm --filter @immich/plugin-core build
      - name: Verify OpenAPI and TypeScript client freshness
        run: |
          pnpm --filter immich build
          pnpm --filter immich exec node dist/bin/sync-open-api.js
          git diff --exit-code -- open-api/immich-openapi-specs.json
          oazapfts --optimistic --argumentStyle=object --useEnumType --allSchemas open-api/immich-openapi-specs.json packages/sdk/src/fetch-client.ts
          git diff --exit-code -- packages/sdk/src/fetch-client.ts
          pnpm --filter @immich/sdk build
          pnpm --filter @immich/sdk test
      - name: Check server types and lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm --filter immich check
          pnpm --filter immich lint
      - name: Run server unit tests
        run: pnpm --filter immich test --run
      - name: Run server medium tests with local PostgreSQL containers
        run: pnpm --filter immich test:medium --run
      - name: Check web types and Svelte components
        run: |
          pnpm --filter immich-web exec svelte-kit sync
          pnpm --filter immich-web check:typescript
          pnpm --filter immich-web check:svelte
      - name: Check CLI and migration command
        run: |
          pnpm --filter @immich/cli check
          pnpm --filter @immich/cli lint
          pnpm --filter @immich/cli test --run
          pnpm --filter @immich/cli build
          node packages/cli/bin/immich migrate --help
      - name: Check end-to-end fixtures against generated clients
        run: pnpm --filter immich-e2e check
      - name: Run web unit tests
        run: pnpm --filter immich-web test --run

  machine-learning:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
          python-version: '3.12'
      - name: Install locked CPU test dependencies
        run: uv sync --frozen --extra cpu --group test --no-default-groups
      - name: Run ML unit tests without model downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MACHINE_LEARNING_TEST_FULL: 'false'
        run: .venv/bin/python -m pytest -q

  machine-learning-containers:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [cpu, cuda]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build ML runtime with locked fork dependencies
        run: docker build --build-arg DEVICE=${{ matrix.device }} --target prod -t fork-ml-test machine-learning
      - name: Verify runtime imports without downloading models
        run: |
          docker run --rm --entrypoint python fork-ml-test -c 'import onnxruntime; import immich_ml.models.image_description'
      - name: Verify the CUDA image-description stack without a GPU
        if: matrix.device == 'cuda'
        run: |
          docker run --rm --entrypoint python fork-ml-test -c 'import torch; import torchvision; from transformers import AutoProcessor, Qwen2_5_VLForConditionalGeneration'
