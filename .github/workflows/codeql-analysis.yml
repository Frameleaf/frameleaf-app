name: CodeQL
'on':
  workflow_dispatch: null
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:${{matrix.language}}
          upload: false
          output: codeql-results
      - name: Save CodeQL report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 7
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    timeout-minutes: 60
  publish-results:
    name: Publish mainline CodeQL findings
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      }}
    needs:
      - analyze
    runs-on: nscloud-ubuntu-24.04-amd64-8x16
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Download this run analysis reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: codeql-*
          path: codeql-reports
          merge-multiple: true
      - name: Upload trusted mainline SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: codeql-reports
