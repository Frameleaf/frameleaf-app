name: CodeQL
"on":
  workflow_dispatch: null
  pull_request:
    branches:
      - fork/main
  push:
    branches:
      - fork/main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:${{matrix.language}}
          upload: false
          output: codeql-results
      - name: Save CodeQL report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 7
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    timeout-minutes: 60
  publish-results:
    name: Publish mainline CodeQL findings
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && github.event_name == 'push' && github.ref == 'refs/heads/fork/main'
      }}
    needs:
      - analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Download this run analysis reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codeql-*
          path: codeql-reports
          merge-multiple: true
      - name: Upload trusted mainline SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: codeql-reports
