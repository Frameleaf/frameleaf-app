name: CLI Build
"on":
  pull_request:
    branches:
      - fork/main
    paths:
      - packages/cli/**
      - packages/sdk/**
      - pnpm-lock.yaml
      - .github/workflows/cli.yml
  push:
    branches:
      - fork/main
    paths:
      - packages/cli/**
      - packages/sdk/**
      - pnpm-lock.yaml
      - .github/workflows/cli.yml
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact current fork/main CLI image (requires FRAMELEAF_ENABLE_CLI_PUBLISH)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: CLI container build
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && github.event_name != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64
          push: false
          tags: frameleaf-cli:ci
  publish:
    name: CLI Publish
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && vars.FRAMELEAF_ENABLE_CLI_PUBLISH == 'true' && (github.event_name
      == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/fork/main'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release commit is the current delivery branch
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit SHA."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/fork/main
          branch_sha=$(git rev-parse FETCH_HEAD)
          head_sha=$(git rev-parse HEAD)
          if [[ "$branch_sha" != "$CANDIDATE_SHA" || "$head_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::CLI publication requires the exact current fork/main commit."
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Login to owned GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Container tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/frameleaf/frameleaf-cli
          flavor: latest=false
          tags: |-
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - name: Publish CLI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
