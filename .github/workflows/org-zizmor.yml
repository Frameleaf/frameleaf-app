name: Zizmor

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous Zizmor runs for the same PR/branch when a new push lands.
# The push-to-main case still serializes (one run per commit) so the audit
# results posted to the security tab reflect the latest tip. Standard
# pattern: cancel only for PR triggers, queue for push to avoid losing
# the post-merge audit on rapid back-to-back merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  zizmor-skipped:
    # Preserve the existing fork-only no-op check; no upstream reusable workflow.
    name: Zizmor
    if: >-
      ${{ github.repository == 'adamtaylor152/immich' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (github.repository_owner != 'immich-app') }}
    runs-on: [self-hosted, Linux, X64, aiimmich]
    permissions: {}
    steps:
      - name: Mark as skipped
        run: |
          echo "::notice::Zizmor is upstream-only. This fork runs no-op to satisfy required checks."
