name: Zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    # Skip on forks: Zizmor's impostor-commit audit needs to list tags on every
    # referenced third-party action via the GitHub API, which the fork's runner
    # token isn't authorized for and returns 403.
    if: github.repository_owner == 'immich-app'
    uses: immich-app/devtools/.github/workflows/shared-zizmor.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write

  zizmor-skipped:
    # Required-check satisfaction: when the `zizmor` reusable workflow is
    # skipped (fork environment), this job posts a passing status with the
    # same name pattern so any branch-protection rule that lists "Zizmor"
    # as required does not block the PR. Stays neutral on the upstream repo
    # where the real `zizmor` job runs.
    name: Zizmor (skipped on fork)
    if: github.repository_owner != 'immich-app'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mark as skipped
        run: |
          echo "::notice::Zizmor is upstream-only. This fork runs no-op to satisfy required checks."
