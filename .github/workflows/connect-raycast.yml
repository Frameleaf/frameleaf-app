name: Connect Raycast extension

on:
  pull_request:
    paths:
      - integrations/raycast/**
      - .github/workflows/connect-raycast.yml
  push:
    branches: [main]
    paths:
      - integrations/raycast/**
      - .github/workflows/connect-raycast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      # `ray lint` also checks the Store author handle online; that belongs to Store submission.
      - run: npx eslint src test
      - run: npx prettier --check src test help README.md
      - run: npx ray build -e dist
      - run: bash .github/check-repository-hygiene.sh
        working-directory: .
