name: PR 812 focused ML quality
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: machine-learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 199f3f340015d6d48829eb56d86117ced5785de5
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: true
          version: '0.13.4'
          python-version: '3.12.15'
      - name: Install locked CPU test dependencies
        run: uv sync --frozen --extra cpu --group test --no-default-groups
      - name: Run ML unit tests without model downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          MACHINE_LEARNING_TEST_FULL: 'false'
        run: .venv/bin/python -m pytest -q

