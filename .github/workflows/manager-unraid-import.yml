name: Manager Unraid import
# Before each Manager release: a real upstream Immich imported by this commit's Manager on an
# Unraid-shaped host (manager/test/unraid-import.mjs). Also runs locally: see the script header.
on:
  workflow_dispatch:
    inputs:
      immich_tag:
        description: Immich release to import from (blank = latest)
        type: string
        default: ''
      frameleaf_tag:
        description: Frameleaf release Manager installs (blank = newest offered)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  import:
    name: Unraid import (${{ matrix.architecture }})
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Configure public Docker Hub mirror
        run: bash scripts/configure-dockerhub-mirror.sh
      - name: Build this commit's Manager
        run: docker build -f manager/Dockerfile -t frameleaf-manager:unraid-qa .
      - name: Import a real Immich on a simulated Unraid host
        env:
          GH_TOKEN: ${{ github.token }}
          IMMICH_TAG: ${{ inputs.immich_tag }}
          FRAMELEAF_TAG: ${{ inputs.frameleaf_tag }}
          REPORT: ${{ runner.temp }}/unraid-import-report.json
        run: |
          [ -n "$IMMICH_TAG" ] || unset IMMICH_TAG
          [ -n "$FRAMELEAF_TAG" ] || unset FRAMELEAF_TAG
          node manager/test/unraid-import.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unraid-import-${{ matrix.architecture }}
          path: ${{ runner.temp }}/unraid-import-report.json
          if-no-files-found: warn
