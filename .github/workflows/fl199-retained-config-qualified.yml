name: FL199 retained configuration admission qualification
on:
  push:
    branches: [aj/fl199-retained-config-qualified]
permissions:
  contents: read
jobs:
  retained-config:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install locked fixture dependencies
        run: pnpm --filter immich install --frozen-lockfile
      - name: Exercise retained configuration admission and trust controls
        run: |
          set -o pipefail
          node --test --test-concurrency=1 packaging/nas/build.test.cjs \
            2>&1 | tee "$RUNNER_TEMP/fl199-retained-config.log"
      - name: Retain admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fl199-retained-config-admission
          path: ${{ runner.temp }}/fl199-retained-config.log
          if-no-files-found: error
          retention-days: 7
