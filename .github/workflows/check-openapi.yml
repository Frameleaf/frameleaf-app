# The explicit maintainer label is retained; comparisons use the PR event base SHA, never a moving branch URL.
name: Check OpenAPI
'on':
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact Frameleaf base commit SHA for comparison
        required: true
        type: string
  pull_request:
    branches:
      - fork/main
      - master/frameleaf-implementation
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
    paths:
      - open-api/**
      - server/src/dtos/**
      - .oasdiff.yaml
      - scripts/frameleaf-openapi-policy.test.mjs
      - scripts/prepare-openapi-comparison-base.mjs
      - scripts/openapi-comparison-base.test.mjs
      - scripts/configure-dockerhub-mirror.sh
      - scripts/dockerhub-mirror.test.mjs
      - .github/workflows/check-openapi.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-openapi:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable comparison commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |-
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::An exact 40-character base commit SHA is required."
            exit 1
          fi
      - name: Checkout exact PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          path: .frameleaf-api-base
          persist-credentials: false
      - name: Configure public Docker Hub mirror
        working-directory: .
        run: bash scripts/configure-dockerhub-mirror.sh
      - name: Verify SDK operation compatibility policy
        run: node --test scripts/frameleaf-openapi-policy.test.mjs
      - name: Verify legacy comparison-base equivalence and breaking controls
        run: node --test scripts/openapi-comparison-base.test.mjs
      - name: Derive explicit legacy-dialect comparison base
        run: >-
          node scripts/prepare-openapi-comparison-base.mjs
          .frameleaf-api-base/open-api/immich-openapi-specs.json
          .frameleaf-api-base/open-api/immich-openapi-comparison-base.json
      - name: Check for breaking API changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') }}
        run: |-
          docker run --rm --network none -e OASDIFF_INTERNAL=1 \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            tufin/oasdiff:v1.31.0 breaking --format json --fail-on ERR \
            /workspace/.frameleaf-api-base/open-api/immich-openapi-comparison-base.json \
            /workspace/open-api/immich-openapi-specs.json
