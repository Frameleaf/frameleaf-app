name: Check OpenAPI
on:
  workflow_dispatch:
  pull_request:
    # labeled/unlabeled re-evaluate the api-breaking-approved gate below
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'open-api/**'
      - 'mobile/lib/utils/openapi_patching.dart'
      - '.github/workflows/check-openapi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-openapi:
    # Breaking API changes can be acknowledged explicitly (e.g. upstream sync
    # merges that inherit upstream's own deliberate breaking changes) by adding
    # the `api-breaking-approved` label to the PR.
    if: >-
      ${{ github.repository == 'adamtaylor152/immich' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!contains(github.event.pull_request.labels.*.name, 'api-breaking-approved')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for breaking API changes
        uses: oasdiff/oasdiff-action/breaking@9c0494cfee8b8fcc9fb383ed2d5d3fbdae169b93 # v0.1.15
        with:
          base: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.base_ref || 'fork/main' }}/open-api/immich-openapi-specs.json
          revision: open-api/immich-openapi-specs.json
          fail-on: ERR
          review: false
