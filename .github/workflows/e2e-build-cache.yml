# Build cache for the Test workflow's server image (FL-380).
#
# The end-to-end and medium jobs in test.yml build server/Dockerfile on every pull request. Without a
# cache that matches the integration branch each of them compiles the image's media libraries from
# source, about twenty minutes per job. This workflow builds the same image, with the same Compose
# build definition the end-to-end jobs use, on every push to master/frameleaf-implementation and
# writes the build cache under ci-<platform> tags. Pull request runs only read it.
#
# It never runs pull request code, pushes no image, and never writes the release pipeline's cache
# tags (linux-<arch>-cpu-prod, written by Deploy on fork/main).
name: End-to-End Build Cache

on:
  push:
    branches: [master/frameleaf-implementation]

# A running export always finishes; a newer push replaces any queued run.
concurrency:
  group: e2e-build-cache
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Write the ${{ matrix.platform }} build cache
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/master/frameleaf-implementation' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      FRAMELEAF_CI_NODE_IMAGE: mirror.gcr.io/library/node@sha256:db3ae80f5d8df06e04dabdf7b44cbf008d32de168205fa0294444aabbc08c590
      FRAMELEAF_CI_STUDIO_NODE_IMAGE: mirror.gcr.io/library/node@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configure public Docker Hub mirror
        run: bash scripts/configure-dockerhub-mirror.sh
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the end-to-end server image and write its cache
        working-directory: ./e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_REF: ghcr.io/frameleaf/frameleaf-server-build-cache:ci-${{ matrix.platform }}
        run: |
          # The build context is the repository root, one level above this Compose file; Bake refuses
          # to read outside its own directory unless that is allowed.
          docker buildx bake --allow=fs.read=.. -f docker-compose.yml frameleaf-server \
            --set "frameleaf-server.cache-to=type=registry,ref=${CACHE_REF},mode=max,compression=zstd" \
            --set frameleaf-server.output=type=cacheonly
