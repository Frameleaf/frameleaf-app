name: PR Label Validation

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no attacker inputs are used here
    types: [opened, labeled, unlabeled, synchronize]

# Cancel stale validations when label set changes — the latest event is the
# source of truth for the required-label check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-release-label:
    # Upstream-only: changelog labels are for immich-app/immich's release process.
    if: >-
      ${{ github.repository == 'adamtaylor152/immich' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (github.repository == 'immich-app/immich' && !startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')) }}
    runs-on: [self-hosted, Linux, X64, aiimmich]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Require PR to have a changelog label
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          token: ${{ github.token }}
          mode: exactly
          count: 1
          use_regex: true
          labels: 'changelog:.*'
          add_comment: true
          message: 'Label error. Requires {{errorString}} {{count}} of: {{ provided }}. Found: {{ applied }}. A maintainer will add the required label.'
