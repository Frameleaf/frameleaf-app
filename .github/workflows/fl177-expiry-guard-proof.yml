name: FL177 actual expiry guard entry diagnosis
on:
  push:
    branches: [aj/fl177-expiry-guard-proof]
permissions:
  contents: read
jobs:
  expiry-guard:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install locked server dependencies
        run: mise run //server:install
      - name: Build actual plugin prerequisites
        run: |
          mise run //:plugins
          mise run //packages/plugin-core:build
      - name: Exercise actual expiry and revoke descriptor guards
        working-directory: ./server
        run: |
          set -o pipefail
          mise run test-medium --run test/medium/specs/repositories/icloud-identity-adoption.repository.spec.ts \
            --testNamePattern 'refuses late readonly guard settlement' \
            2>&1 | tee "$RUNNER_TEMP/fl177-expiry-guard.log"
      - name: Retain actual descriptor guard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fl177-expiry-guard
          path: ${{ runner.temp }}/fl177-expiry-guard.log
          if-no-files-found: error
          retention-days: 7
