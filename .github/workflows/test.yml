name: PR 812 focused Test
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-unit-tests:
    name: Test & Lint Server
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 199f3f340015d6d48829eb56d86117ced5785de5
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          persist_github_token: true
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.10.8
      - name: Run ci-unit
        run: |
          export FL285_VOLUME_FOLDER="$RUNNER_TEMP/fl285-volume"
          mkdir "$FL285_VOLUME_FOLDER"
          sudo mount -t tmpfs -o "size=32m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$FL285_VOLUME_FOLDER"
          trap 'sudo umount "$FL285_VOLUME_FOLDER"; rmdir "$FL285_VOLUME_FOLDER"' EXIT
          mise run //server:ci-unit
      - name: Run Buddy Backup and recovery runtime tests
        working-directory: ./server
        run: node --test --test-timeout=15000 test/runtime/buddy-backup.test.mjs test/runtime/buddy-recovery.test.mjs
      - name: Capture automatic server lint fixes
        if: failure()
        run: |
          timeout 15m pnpm --filter frameleaf format:fix || true
          timeout 15m pnpm --filter frameleaf lint:fix || true
          git diff --binary > "$RUNNER_TEMP/server-lint.patch"
      - name: Archive automatic server lint fixes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-lint-autofix
          path: ${{ runner.temp }}/server-lint.patch
          retention-days: 7
    timeout-minutes: 60
  ml-unit-tests:
    name: Unit Test ML
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./machine-learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 199f3f340015d6d48829eb56d86117ced5785de5
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          persist_github_token: true
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.10.8
      - name: Run ci-unit
        run: mise run ci-unit
    timeout-minutes: 60
