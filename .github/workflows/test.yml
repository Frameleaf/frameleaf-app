name: Test
'on':
  workflow_dispatch: null
  pull_request:
    branches:
      - fork/main
  push:
    branches:
      - fork/main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  script-unit-tests:
    name: Scripts unit tests
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install script test dependencies
        run: pnpm --filter @immich/scripts --filter immich install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --filter @immich/scripts test
      - name: Validate Frameleaf workflow contracts
        run: node --test scripts/frameleaf-workflows.test.mjs
      - name: Validate Frameleaf documentation and Jira coverage
        run: |
          node scripts/frameleaf-documentation-coverage.mjs
          node --test scripts/frameleaf-documentation-coverage.test.mjs
      - name: Validate independent Studio conformance evidence
        run: |
          node studio/tools/conformance.mjs
          node --test studio/tools/conformance.test.mjs
      - name: Validate Frameleaf prototype conformance evidence
        run: node --test scripts/frameleaf-conformance-audit.test.mjs
    timeout-minutes: 60
  server-unit-tests:
    name: Test & Lint Server
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-unit
        run: mise run //server:ci-unit
      - name: Capture automatic server lint fixes
        if: failure()
        run: |
          timeout 15m pnpm --filter immich lint:fix || true
          git diff --binary > "$RUNNER_TEMP/server-lint.patch"
      - name: Archive automatic server lint fixes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: server-lint-autofix
          path: ${{ runner.temp }}/server-lint.patch
          retention-days: 7
    timeout-minutes: 60
  cli-unit-tests:
    name: Unit Test CLI
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-unit
        run: mise run ci-unit
    timeout-minutes: 60
  cli-unit-tests-win:
    name: Unit Test CLI (Windows)
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run setup @immich/sdk
        run: mise run //:sdk:install && mise run //:sdk:build
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile
      - name: Run tsc
        run: pnpm check
        if: ${{ !cancelled() }}
      - name: Run unit tests & coverage
        run: pnpm test
        if: ${{ !cancelled() }}
    timeout-minutes: 60
  web-lint:
    name: Lint Web
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run setup @immich/sdk
        run: mise run //:sdk:install && mise run //:sdk:build
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm lint
        if: ${{ !cancelled() }}
      - name: Capture automatic lint fixes
        if: failure()
        run: |
          timeout 15m pnpm lint:fix || true
          git diff --binary > "$RUNNER_TEMP/web-lint.patch"
      - name: Archive automatic lint fixes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-lint-autofix
          path: ${{ runner.temp }}/web-lint.patch
          retention-days: 7
    timeout-minutes: 60
  web-unit-tests:
    name: Test Web
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-unit
        run: mise run ci-unit
    timeout-minutes: 60
  i18n-tests:
    name: Test i18n
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile
      - name: Format
        run: pnpm format:fix
      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf
        id: verify-changed-files
        with:
          files: |
            i18n/**
      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: i18n files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          exit 1
    timeout-minutes: 60
  e2e-tests-lint:
    name: End-to-End Lint
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-unit
        run: mise run ci-unit
        if: ${{ !cancelled() }}
    timeout-minutes: 60
  server-medium-tests:
    name: Medium Tests (Server)
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-medium
        run: mise run ci-medium
        if: ${{ !cancelled() }}
    timeout-minutes: 60
  e2e-tests-server-cli:
    name: End-to-End Tests (Server & CLI)
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Setup packages
        run:
          pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile && pnpm --filter @immich/sdk --filter
          @immich/cli build
      - name: Run setup web
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
        working-directory: ./web
        if: ${{ !cancelled() }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        if: ${{ !cancelled() }}
      - name: Start Docker Compose
        id: docker
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
        if: ${{ !cancelled() }}
      - name: Wait for Immich server readiness
        id: server-ready
        env:
          SERVER_PING_URL: http://127.0.0.1:2285/api/server/ping
        run: |
          if timeout 120s bash -c 'until curl --fail --silent --max-time 2 "$SERVER_PING_URL" > /dev/null; do sleep 2; done'; then
            echo "Immich server is ready"
            exit 0
          fi

          echo "::error::Immich server did not become ready within 120 seconds"
          docker compose ps
          docker compose logs --no-color --tail 200 immich-server
          exit 1
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}
      - name: Run e2e tests (api & cli)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test
        if: ${{ !cancelled() && steps.server-ready.outcome == 'success' }}
      - name: Capture server diagnostics after API tests
        if: always()
        working-directory: ./e2e
        run: |
          {
            date --utc --iso-8601=seconds
            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue
              docker inspect --format '{{json .Name}} {{json .State}} {{json .RestartCount}}' "$container_id" || true
            done < <(docker compose ps --all --quiet)
            docker compose logs --no-color --timestamps || true
          } > docker-diagnostics-after-api-tests.txt 2>&1
      - name: Run e2e tests (maintenance)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test:maintenance
        if: ${{ !cancelled() && steps.server-ready.outcome == 'success' }}
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt
        working-directory: ./e2e
      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: e2e-server-docker-logs-${{ matrix.runner }}
          path: |
            e2e/docker-compose-logs.txt
            e2e/docker-diagnostics-after-api-tests.txt
    # The server image compiles its own media libraries (FL-191), which lengthens the Compose build.
    timeout-minutes: 120
  e2e-tests-web:
    name: End-to-End Tests (Web)
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./e2e
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Run setup @immich/sdk
        run: pnpm --filter @immich/sdk install --frozen-lockfile && pnpm --filter @immich/sdk build
        if: ${{ !cancelled() }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        if: ${{ !cancelled() }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --only-shell
        if: ${{ !cancelled() }}
      - name: Docker build
        id: docker
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
        if: ${{ !cancelled() }}
      - name: Run e2e tests (web)
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}
      - name: Archive e2e test (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: e2e-web-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/
      - name: Run ui tests (web)
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web:ui
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}
      - name: Archive ui test (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: e2e-ui-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/
      - name: Run maintenance tests
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        run: pnpm test:web:maintenance
        if: ${{ !cancelled() && steps.docker.outcome == 'success' }}
      - name: Archive maintenance tests (web) results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: e2e-maintenance-isolated-test-results-${{ matrix.runner }}
          path: e2e/playwright-report/
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt
        working-directory: ./e2e
      - name: Archive Docker logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: e2e-web-docker-logs-${{ matrix.runner }}
          path: e2e/docker-compose-logs.txt
    # The server image compiles its own media libraries (FL-191), which lengthens the Compose build.
    timeout-minutes: 120
  success-check-e2e:
    name: End-to-End Tests Success
    needs:
      - e2e-tests-server-cli
      - e2e-tests-web
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && always() }}
    steps:
      - uses: immich-app/devtools/actions/success-check@81113db03f6d743efee81e0058c0b43f6cd6f36d
        with:
          needs: ${{ toJSON(needs) }}
    timeout-minutes: 60
  ml-unit-tests:
    name: Unit Test ML
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./machine-learning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run ci-unit
        run: mise run ci-unit
    timeout-minutes: 60
  github-files-formatting:
    name: .github Files Formatting
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./.github
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Run pnpm install
        run: pnpm install --frozen-lockfile
      - name: Run formatter
        run: pnpm format
        if: ${{ !cancelled() }}
    timeout-minutes: 60
  shellcheck:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    name: ShellCheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          ignore_paths: '**/open-api/** **/openapi** **/node_modules/**'
    timeout-minutes: 60
  generated-api-up-to-date:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    name: OpenAPI Clients
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install server dependencies
        run: pnpm --filter immich install --frozen-lockfile
      - name: Run API generation
        run: |
          mise run //:plugins
          mise run //server:build
          mise run //server:sync-open-api
          mise run //:open-api-typescript
      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf
        id: verify-changed-files
        with:
          files: |
            packages/sdk
            open-api/immich-openapi-specs.json
      - name: Verify files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          exit 1
      - name: Archive generated API files
        if: failure() && steps.verify-changed-files.outputs.files_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-generated-api
          path: |
            packages/sdk/src/fetch-client.ts
            open-api/immich-openapi-specs.json
          retention-days: 7
    timeout-minutes: 60
  sql-schema-up-to-date:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    name: SQL Schema Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Frameleaf's own Postgres image (docker/postgres), built here rather than pulled. VectorChord is the
      # only preloaded extension and the search path is the default, matching the schema baseline.
      - name: Start Frameleaf Postgres
        run: |-
          set -euo pipefail
          docker build -t frameleaf-postgres:ci docker/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=immich \
            frameleaf-postgres:ci \
            postgres -c config_file=/etc/postgresql/postgresql.conf \
            -c shared_preload_libraries=vchord.so -c 'search_path="$user", public'
          for _ in $(seq 1 60); do
            logs=$(docker logs postgres 2>&1 || true)
            if [[ "$logs" == *'PostgreSQL init process complete'* ]] &&
              docker exec postgres pg_isready -U postgres -d immich > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::Postgres did not become ready."
          exit 1
      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - name: Install server dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugins
        run: mise run //:plugins
      - name: Build the app
        run: mise run //server:build
      - name: Run existing migrations
        run: pnpm --filter immich migrations:run
      - name: Capture exact fork catalog for reconciliation
        run: pnpm --filter immich exec tsx scripts/snapshot-fork-schema-catalog.ts /tmp/fork-v2-catalog.json
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/immich
      - name: Archive exact fork catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-fork-catalog-diagnostic
          path: /tmp/fork-v2-catalog.json
          retention-days: 7
      - name: Test npm run schema:reset command works
        run: pnpm --filter immich schema:reset
      - name: Generate new migrations
        run: pnpm --filter immich migrations:generate src/schema/migrations/TestMigration
      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf
        id: verify-changed-files
        with:
          files: |
            server/src
      - name: Verify migration files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated migration files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          cat ./server/src/schema/migrations/*-TestMigration.ts
          exit 1
      - name: Archive generated migration diagnostics
        if: failure() && steps.verify-changed-files.outputs.files_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sql-schema-migration-diagnostics
          path: |
            server/src/schema/migrations/*-TestMigration.ts
            server/src/schema/migrations/ORDER
          retention-days: 7
      - name: Run SQL generation
        run: mise run //:sql
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/immich
      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf
        id: verify-changed-sql-files
        with:
          files: |
            server/src/queries
      - name: Verify SQL files have not changed
        if: steps.verify-changed-sql-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-sql-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated SQL files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          git diff
          exit 1
      - name: Archive generated SQL files
        if: failure() && steps.verify-changed-sql-files.outputs.files_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-generated-sql
          path: server/src/queries
          retention-days: 7
    timeout-minutes: 60
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/immich
