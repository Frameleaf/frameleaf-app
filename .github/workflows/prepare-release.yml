# Inherited version-writing and Weblate release pipeline is disabled; Frameleaf release preparation is separately controlled.
# No scheduled/event-driven mutations or foreign credentials are retained.
name: Prepare new release
"on":
  workflow_dispatch: null
permissions: {}
jobs:
  disabled:
    name: Legacy automation is disabled
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain the retired automation
        run:
          printf '%s\n' 'Inherited version-writing and Weblate release pipeline is disabled; Frameleaf release preparation
          is separately controlled.' 'No external action was taken. Configure an owned replacement in a reviewed change before
          enabling automation.'
