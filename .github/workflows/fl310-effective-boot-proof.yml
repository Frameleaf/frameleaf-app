name: FL310 effective replacement boot proof
on:
  push:
    branches: [aj/fl310-effective-boot-proof]
permissions:
  contents: read
jobs:
  replacement-boot:
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          github_token: ${{ github.token }}
          install_args: --locked
          version: 2026.7.12
      - run: mise run //server:install
      - run: mise run //:plugins
      - run: mise run //packages/plugin-core:build
      - name: Build the existing replacement distribution
        run: mise run //server:build
      - name: Check the actual entrypoint's first cached configuration in fresh processes
        run: node --test --test-timeout=90000 server/test/runtime/buddy-boot-binding.test.mjs server/test/runtime/buddy-recovery.test.mjs
      - name: Check readiness finalization in the existing recovery service suite
        if: ${{ !cancelled() }}
        working-directory: server
        run: >-
          pnpm exec vitest --config test/vitest.config.mjs --run
          src/main.spec.ts src/services/buddy-backup-recovery.service.spec.ts
          src/maintenance/maintenance-worker.service.spec.ts
      - name: Check actual encrypted capture and recovery compatibility
        if: ${{ !cancelled() }}
        working-directory: server
        run: >-
          pnpm exec vitest --config test/vitest.config.medium.mjs --run
          test/medium/specs/repositories/buddy-capture.spec.ts
      - name: Collect genuine boot regression formatting output
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          pnpm format:fix
          git diff --binary -- src/main.ts src/supervisor.ts src/utils/buddy-boot-binding.ts src/services/buddy-backup-recovery.service.ts src/services/buddy-backup-recovery.service.spec.ts test/runtime/buddy-boot-binding.test.mjs > "$RUNNER_TEMP/effective-boot-format.patch"
      - name: Archive boot regression formatter output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fl310-effective-boot-format
          path: ${{ runner.temp }}/effective-boot-format.patch
          retention-days: 7
