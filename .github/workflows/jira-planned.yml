name: Jira planned versions

on:
  # Default-branch code validates the request's PR association and reads only JSON metadata.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Jira plan request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Owned PR number to reconcile without rebuilding
        required: true
        type: string

permissions: {}
concurrency:
  group: jira-version-sync
  queue: max

jobs:
  planned:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Reconcile explicit release milestones
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node .github/jira-plan.mjs
