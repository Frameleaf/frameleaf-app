name: Zapier Connect source
on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/zapier/**'
      - '.github/workflows/zapier-connect.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/zapier/**'
      - '.github/workflows/zapier-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zapier-connect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connection-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run validate
