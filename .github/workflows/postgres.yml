# Builds Frameleaf's own PostgreSQL image (docker/postgres) so nothing pulls the upstream database image.
# Pull requests and pushes build and test it on both architectures without publishing. Publication to
# ghcr.io/frameleaf/frameleaf-postgres needs the repository variable FRAMELEAF_ENABLE_POSTGRES_PUBLISH=true
# and either a published release or a manual dispatch with publish selected on the exact current fork/main.
name: Postgres Image
'on':
  pull_request:
    branches:
      - fork/main
    paths:
      - docker/postgres/**
      - .github/workflows/postgres.yml
  push:
    branches:
      - fork/main
    paths:
      - docker/postgres/**
      - .github/workflows/postgres.yml
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact current fork/main Postgres image (requires FRAMELEAF_ENABLE_POSTGRES_PUBLISH)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Postgres image build (${{ matrix.runner }})
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: false
          load: true
          tags: frameleaf-postgres:ci
      - name: Verify PostgreSQL and extension versions
        env:
          EXPECTED_PG_MAJOR: '14'
          EXPECTED_VCHORD: 0.4.3
          EXPECTED_PGVECTOR: 0.8.1
          EXPECTED_PGVECTORS: 0.2.0
        run: |-
          set -euo pipefail
          docker run -d --name frameleaf-postgres-ci \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=immich \
            -e POSTGRES_INITDB_ARGS=--data-checksums \
            frameleaf-postgres:ci
          # The image's own health check (pg_isready plus the checksum-failure count) must pass once
          # initialisation has finished and the server has restarted with the final configuration.
          ready=false
          for _ in $(seq 1 90); do
            logs=$(docker logs frameleaf-postgres-ci 2>&1 || true)
            if [[ "$logs" == *'PostgreSQL init process complete'* ]] &&
              docker exec frameleaf-postgres-ci /usr/local/bin/healthcheck.sh > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs frameleaf-postgres-ci
            echo "::error::The Postgres image did not become ready."
            exit 1
          fi
          query() { docker exec frameleaf-postgres-ci psql -U postgres -d immich -tAX -c "$1"; }
          major=$(query "SELECT current_setting('server_version_num')::int / 10000")
          preload=$(query "SHOW shared_preload_libraries")
          search_path=$(query "SHOW search_path")
          query "CREATE EXTENSION IF NOT EXISTS vchord CASCADE" > /dev/null
          query "CREATE EXTENSION IF NOT EXISTS vectors" > /dev/null
          vchord=$(query "SELECT extversion FROM pg_extension WHERE extname = 'vchord'")
          pgvector=$(query "SELECT extversion FROM pg_extension WHERE extname = 'vector'")
          pgvectors=$(query "SELECT extversion FROM pg_extension WHERE extname = 'vectors'")
          echo "PostgreSQL $major; preload: $preload; search_path: $search_path"
          echo "vchord $vchord, vector $pgvector, vectors $pgvectors"
          [[ "$major" == "$EXPECTED_PG_MAJOR" ]] || { echo "::error::PostgreSQL major is $major"; exit 1; }
          [[ "$preload" == "vchord.so, vectors.so" ]] || { echo "::error::Unexpected preload libraries: $preload"; exit 1; }
          [[ "$search_path" == *vectors* ]] || { echo "::error::The vectors schema is not on the search path"; exit 1; }
          [[ "$vchord" == "$EXPECTED_VCHORD" ]] || { echo "::error::VectorChord is $vchord"; exit 1; }
          [[ "$pgvector" == "$EXPECTED_PGVECTOR" ]] || { echo "::error::pgvector is $pgvector"; exit 1; }
          [[ "$pgvectors" == "$EXPECTED_PGVECTORS" ]] || { echo "::error::pgvecto.rs is $pgvectors"; exit 1; }
          docker rm -f frameleaf-postgres-ci > /dev/null
  publish:
    name: Postgres image publish
    needs: build
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && vars.FRAMELEAF_ENABLE_POSTGRES_PUBLISH == 'true' &&
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref ==
      'refs/heads/fork/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release commit is the current delivery branch
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit SHA."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/fork/main
          branch_sha=$(git rev-parse FETCH_HEAD)
          head_sha=$(git rev-parse HEAD)
          if [[ "$branch_sha" != "$CANDIDATE_SHA" || "$head_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Postgres publication requires the exact current fork/main commit."
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Login to owned GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Container tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/frameleaf/frameleaf-postgres
          flavor: latest=false
          tags: |-
            type=raw,value=14-vectorchord0.4.3-pgvectors0.2.0
            type=sha,format=long
      - name: Publish Postgres image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
