# Builds Frameleaf's own PostgreSQL image (docker/postgres) so nothing pulls the upstream database image.
# Pull requests and pushes build and test it natively on amd64 and arm64 without publishing.
#
# Publication is a manual dispatch with publish selected, on an exact approved delivery branch head, and only when
# the repository variable FRAMELEAF_ENABLE_POSTGRES_PUBLISH=true. It pushes the exact images the build
# jobs tested (no rebuild), never moves an existing version tag, and records the published digest.
# Release promotion (.github/frameleaf-release.cjs) refuses to promote until this image exists and pins
# the bundled Compose files to its digest, so publish it before promoting a release.
name: Postgres Image
'on':
  pull_request:
    branches:
      - fork/main
      - master/frameleaf-implementation
    paths:
      - docker/postgres/**
      - .github/workflows/postgres.yml
  push:
    branches:
      - fork/main
    paths:
      - docker/postgres/**
      - .github/workflows/postgres.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact current delivery branch Postgres image (requires FRAMELEAF_ENABLE_POSTGRES_PUBLISH)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Postgres image build (${{ matrix.runner }})
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare the image output directory
        run: mkdir -p "$RUNNER_TEMP/frameleaf-postgres"
      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: false
          tags: frameleaf-postgres:ci
          outputs: type=docker,dest=${{ runner.temp }}/frameleaf-postgres/image.tar
      - name: Load the built image and record its identity
        run: |-
          set -euo pipefail
          archive="$RUNNER_TEMP/frameleaf-postgres/image.tar"
          docker load -i "$archive"
          # The image configuration digest identifies exactly what is tested and later published.
          config=$(tar -xOf "$archive" manifest.json | jq -r '.[0].Config')
          config_digest="sha256:${config##*/}"
          config_digest="${config_digest%.json}"
          [[ "$config_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Unreadable image configuration $config"; exit 1; }
          architecture=$(docker image inspect --format '{{.Architecture}}' frameleaf-postgres:ci)
          printf '%s\n' "$config_digest" > "$RUNNER_TEMP/frameleaf-postgres/config-digest"
          printf '%s\n' "$architecture" > "$RUNNER_TEMP/frameleaf-postgres/architecture"
          echo "Built frameleaf-postgres for $architecture with configuration $config_digest"
      - name: Verify PostgreSQL and extension versions
        env:
          EXPECTED_PG_MAJOR: '19'
          EXPECTED_PGVECTOR: 0.8.7
        run: |-
          set -euo pipefail
          docker run -d --name frameleaf-postgres-ci \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=frameleaf \
            -e POSTGRES_INITDB_ARGS=--data-checksums \
            frameleaf-postgres:ci
          # The image's own health check (pg_isready plus the checksum-failure count) must pass once
          # initialisation has finished and the server has restarted with the final configuration.
          ready=false
          for _ in $(seq 1 90); do
            logs=$(docker logs frameleaf-postgres-ci 2>&1 || true)
            if [[ "$logs" == *'PostgreSQL init process complete'* ]] &&
              docker exec frameleaf-postgres-ci /usr/local/bin/healthcheck.sh > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs frameleaf-postgres-ci
            echo "::error::The Postgres image did not become ready."
            exit 1
          fi
          query() { docker exec frameleaf-postgres-ci psql -U postgres -d frameleaf -tAX -c "$1"; }
          major=$(query "SELECT current_setting('server_version_num')::int / 10000")
          query "CREATE EXTENSION IF NOT EXISTS vector" > /dev/null
          pgvector=$(query "SELECT extversion FROM pg_extension WHERE extname = 'vector'")
          [[ "$major" == "$EXPECTED_PG_MAJOR" ]] || { echo "::error::PostgreSQL major is $major"; exit 1; }
          [[ "$pgvector" == "$EXPECTED_PGVECTOR" ]] || { echo "::error::pgvector is $pgvector"; exit 1; }
          [[ "$(query "SELECT count(*) FROM pg_extension WHERE extname IN ('vectors', 'vchord')")" == "0" ]] || { echo "::error::Legacy vector extensions found"; exit 1; }
          query "CREATE TABLE hnsw_probe (id integer PRIMARY KEY, embedding vector(3)); INSERT INTO hnsw_probe VALUES (1, '[1,0,0]'), (2, '[0,1,0]'); CREATE INDEX ON hnsw_probe USING hnsw (embedding vector_cosine_ops);" > /dev/null
          nearest=$(query "SET enable_seqscan=off; SELECT id FROM hnsw_probe ORDER BY embedding <=> '[1,0,0]' LIMIT 1" | tail -n1)
          [[ "$nearest" == "1" ]] || { echo "::error::HNSW nearest-neighbor result differs"; exit 1; }
          query "DROP TABLE hnsw_probe" > /dev/null
          docker rm -f frameleaf-postgres-ci > /dev/null
      - name: Keep the tested image for publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frameleaf-postgres-${{ matrix.runner }}
          path: ${{ runner.temp }}/frameleaf-postgres/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Postgres image publish
    needs: build
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && vars.FRAMELEAF_ENABLE_POSTGRES_PUBLISH == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/fork/main' || github.ref == 'refs/heads/master/frameleaf-implementation' ||
      github.ref == 'refs/heads/aj/FL-333-pg19') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ghcr.io/frameleaf/frameleaf-postgres
      VERSION_TAG: 19beta4-pgvector0.8.7
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release commit is the current delivery branch
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |-
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit SHA."
            exit 1
          fi
          case "$SOURCE_REF" in
            refs/heads/fork/main|refs/heads/master/frameleaf-implementation|refs/heads/aj/FL-333-pg19) ;;
            *) echo "::error::Postgres publication requires an approved delivery branch."; exit 1 ;;
          esac
          git fetch --no-tags origin "$SOURCE_REF"
          branch_sha=$(git rev-parse FETCH_HEAD)
          head_sha=$(git rev-parse HEAD)
          if [[ "$branch_sha" != "$CANDIDATE_SHA" || "$head_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Postgres publication requires the exact current delivery branch commit."
            exit 1
          fi
      - name: Download the tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frameleaf-postgres-*
          path: ${{ runner.temp }}/tested
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to owned GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested images without overwriting a version
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          # Exactly one tested image per architecture, checked before anything is pushed.
          seen=$(for runner in ubuntu-24.04 ubuntu-24.04-arm; do cat "$RUNNER_TEMP/tested/frameleaf-postgres-$runner/architecture"; done | sort | tr '\n' ' ')
          if [[ "$seen" != "amd64 arm64 " ]]; then
            echo "::error::Expected one amd64 and one arm64 tested image, found: $seen"
            exit 1
          fi
          children=()
          for runner in ubuntu-24.04 ubuntu-24.04-arm; do
            dir="$RUNNER_TEMP/tested/frameleaf-postgres-$runner"
            tested=$(cat "$dir/config-digest")
            architecture=$(cat "$dir/architecture")
            [[ "$tested" =~ ^sha256:[a-f0-9]{64}$ && "$architecture" =~ ^(amd64|arm64)$ ]] || { echo "::error::Invalid tested image record for $runner"; exit 1; }
            docker load -i "$dir/image.tar"
            staging="$IMAGE:commit-$SOURCE_SHA-$architecture"
            docker tag frameleaf-postgres:ci "$staging"
            docker push "$staging"
            pushed=$(docker buildx imagetools inspect --raw "$staging" | jq -r .config.digest)
            if [[ "$pushed" != "$tested" ]]; then
              echo "::error::Pushed $architecture configuration $pushed is not the tested $tested."
              exit 1
            fi
            child=$(digest_of "$staging")
            [[ "$child" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Unreadable $architecture digest"; exit 1; }
            echo "digest-$architecture=$child" >> "$GITHUB_OUTPUT"
            children+=("$IMAGE@$child")
          done
          # The version tag is absent only on a confirmed not-found; any other registry error stops here.
          existing=""
          if output=$(docker buildx imagetools inspect "$IMAGE:$VERSION_TAG" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/inspect.err"); then
            existing=$(jq -r .digest <<< "$output")
            [[ "$existing" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Unreadable digest for $IMAGE:$VERSION_TAG"; exit 1; }
          elif ! grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err"
            echo "::error::Could not determine whether $IMAGE:$VERSION_TAG exists; refusing to publish."
            exit 1
          fi
          if [[ -n "$existing" ]]; then
            # A version tag is immutable: a new build has a new digest, so it needs a new version tag.
            docker buildx imagetools create --tag "$IMAGE:commit-$SOURCE_SHA" "${children[@]}"
            index=$(digest_of "$IMAGE:commit-$SOURCE_SHA")
            if [[ "$existing" != "$index" ]]; then
              echo "::error::$IMAGE:$VERSION_TAG already points to $existing; this build is $index. Publish a new version tag instead of overwriting it."
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION_TAG" --tag "$IMAGE:commit-$SOURCE_SHA" "${children[@]}"
            index=$(digest_of "$IMAGE:$VERSION_TAG")
          fi
          [[ "$index" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Unreadable published digest"; exit 1; }
          echo "digest=$index" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$IMAGE" --arg tag "$VERSION_TAG" --arg digest "$index" --arg source "$SOURCE_SHA" \
            '{image: $image, tag: $tag, digest: $digest, sourceCommit: $source, reference: "\($image):\($tag)@\($digest)"}' \
            > "$RUNNER_TEMP/frameleaf-postgres-digest.json"
          echo "Published $IMAGE:$VERSION_TAG@$index"
      - name: Record the published digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frameleaf-postgres-digest
          path: ${{ runner.temp }}/frameleaf-postgres-digest.json
          if-no-files-found: error
      # One SBOM per architecture, attested to that architecture's image manifest.
      - name: Generate the amd64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest-amd64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: ${{ runner.temp }}/frameleaf-postgres-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest-amd64 }}
          sbom-path: ${{ runner.temp }}/frameleaf-postgres-amd64.spdx.json
          push-to-registry: true
      - name: Generate the arm64 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest-arm64 }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: ${{ runner.temp }}/frameleaf-postgres-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest-arm64 }}
          sbom-path: ${{ runner.temp }}/frameleaf-postgres-arm64.spdx.json
          push-to-registry: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Update latest after successful release publication
        if: ${{ github.ref == 'refs/heads/fork/main' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |-
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fork/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]] || { echo "::error::The release branch advanced; latest was not changed."; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          published=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$published" == "$DIGEST" ]] || { echo "::error::Latest does not match the published image."; exit 1; }
