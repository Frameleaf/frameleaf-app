name: Migration Order
'on':
  pull_request:
    branches:
      - fork/main
      - master/frameleaf-implementation
  push:
    branches:
      - fork/main
      - master/frameleaf-implementation
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-order:
    name: Verify migration ORDER
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && !github.event.created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      BASELINE: ${{ github.workspace }}/.frameleaf-migration-base/server/src/schema/migrations/ORDER
      ORDER: ${{ github.workspace }}/server/src/schema/migrations/ORDER
      FORK_MANIFEST_BASE: ${{ github.workspace }}/.frameleaf-migration-base/server/src/fork-schema/manifests/fork-migration-order.json
      FORK_MANIFEST: ${{ github.workspace }}/server/src/fork-schema/manifests/fork-migration-order.json
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate immutable comparison commit
        run: |-
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::An exact 40-character base commit SHA is required."
            exit 1
          fi
      - name: Checkout exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: ${{ env.BASE_SHA }}
          path: .frameleaf-migration-base
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install migration tooling
        run: pnpm --filter immich install --frozen-lockfile
      - name: Verify fork migration ORDER by authority
        run: |-
          node --test scripts/check-fork-migration-order.test.mjs
          pnpm --filter immich migrations:verify-order
          node scripts/check-fork-migration-order.mjs "$BASELINE" "$ORDER"
      - name: Verify the fork-schema migration manifest is append-only
        run: node scripts/check-fork-migration-order.mjs --fork-manifest "$FORK_MANIFEST_BASE" "$FORK_MANIFEST"
