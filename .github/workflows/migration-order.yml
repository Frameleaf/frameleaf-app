name: Migration Order
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-order:
    name: Verify migration ORDER
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && !github.event.created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install migration tooling
        run: pnpm --filter 'frameleaf...' install --frozen-lockfile
      - name: Verify canonical migration ORDER
        run: pnpm --filter frameleaf migrations:verify-order
