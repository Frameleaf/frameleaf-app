name: Migration Order
'on':
  pull_request:
    branches:
      - fork/main
      - master/frameleaf-implementation
  push:
    branches:
      - fork/main
      - master/frameleaf-implementation
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-order:
    name: Verify migration ORDER
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && !github.event.created }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install migration tooling
        run: pnpm --filter 'frameleaf...' install --frozen-lockfile
      - name: Verify canonical migration ORDER
        run: pnpm --filter frameleaf migrations:verify-order
