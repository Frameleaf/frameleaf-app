name: Migration Order

on:
  pull_request:
  push:
    branches: [main, 'release/*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  migration-order:
    name: Verify migration ORDER
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      BASELINE: ${{ github.workspace }}/base/server/src/schema/migrations/ORDER
      MAIN_MIGRATIONS: ${{ github.workspace }}/main/server/src/schema/migrations
      ORDER: ${{ github.workspace }}/server/src/schema/migrations/ORDER
    steps:
      - id: token
        if: github.repository == 'immich-app/immich'
        uses: immich-app/devtools/actions/create-workflow-token@df46d635b905e618b88fc4c95baa920aeb30b309 # create-workflow-token-action-v3.0.1
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.token.outputs.token || github.token }}

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
          token: ${{ steps.token.outputs.token || github.token }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration ORDER
        if: github.repository == 'immich-app/immich'
        run: pnpm --filter immich migrations:verify-order --append-only-from "${BASELINE}"

      - name: Verify fork migration ORDER by authority
        if: github.repository == 'adamtaylor152/immich'
        run: |
          node --test scripts/check-fork-migration-order.test.mjs
          pnpm --filter immich migrations:verify-order
          node scripts/check-fork-migration-order.mjs "$BASELINE" "$ORDER"

      - name: Checkout main
        if: ${{ startsWith(github.base_ref, 'release/') || startsWith(github.ref_name, 'release/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
          token: ${{ steps.token.outputs.token || github.token }}

      - name: Verify the release line does not diverge from main
        if: ${{ startsWith(github.base_ref, 'release/') || startsWith(github.ref_name, 'release/') }}
        run: pnpm --filter immich migrations:verify-order --source-folder "${MAIN_MIGRATIONS}" --append-only-from "${ORDER}"
