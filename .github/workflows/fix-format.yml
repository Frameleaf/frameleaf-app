name: Fix formatting

on:
  pull_request:
    types: [labeled]

# Cancel a stale in-flight format run when the same PR triggers another fix
# (e.g. the reviewer re-applies the label after a force-push). The label-removal
# step at the end is `if: always()`, so cancellations still clean up the label
# on the PR. No risk on non-PR contexts because the workflow only triggers on
# `pull_request`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  fix-formatting:
    runs-on: ubuntu-24.04
    # SECURITY: only run for PRs from the same repository. A label can be applied
    # by anyone with triage rights, but this workflow checks out the PR head ref
    # and executes `pnpm install` with credentials persisted — running that on a
    # fork's branch is a code-injection pivot (preinstall/postinstall scripts,
    # malicious .npmrc, malicious patches in patches/, etc).
    if: >-
      ${{ github.repository == 'adamtaylor152/immich' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.label.name == 'fix:formatting' && github.event.pull_request.head.repo.fork == false) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Credentials are kept persisted because the EndBug/add-and-commit step
          # below needs them to push the formatting commit back. The PR head is
          # restricted to same-repo branches via the job-level `if:` guard, so
          # a fork-PR cannot reach this checkout. Consider migrating to a
          # GitHub App token scoped to `contents:write` on this repo only.
          persist-credentials: true
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}

      - name: Fix formatting
        # SECURITY: `--ignore-scripts` disables preinstall/postinstall/prepare
        # script execution. This neutralizes the most common pnpm install RCE
        # vector (a malicious package.json `preinstall` running shell on the
        # runner) without changing the trigger semantics. Formatting tooling
        # (prettier, eslint) does not require lifecycle scripts to run.
        #
        # KNOWN RESIDUAL SURFACE: the `pnpm run ... format:fix` invocation below
        # executes each workspace's `format:fix` package.json script. A
        # same-repo collaborator with `pull-requests: write` (label-apply
        # rights) plus `contents: write` (commit rights) can land an arbitrary
        # `format:fix` script in any workspace's package.json, label their
        # PR `fix:formatting`, and obtain RCE on the runner — because
        # `persist-credentials: true` (line 33) preserves the GITHUB_TOKEN in
        # the checkout. `--ignore-scripts` does NOT cover `pnpm run <script>`.
        # The job-level `head.repo.fork == false` guard limits the abuser pool
        # to existing same-repo collaborators (the existing trust model), but
        # it does not close the path. Long-term fix: migrate the commit step
        # to a scoped GitHub App token and drop `persist-credentials: true`.
        # Tracked as known-issue; sandboxing `pnpm run` here is more invasive
        # than the residual risk warrants in the same-repo trust model.
        run: |
          pnpm --recursive install --ignore-scripts
          # See above: format:fix is workspace-controlled. Treat as trusted only
          # to the extent the same-repo write-access pool is trusted.
          pnpm run --recursive --if-present --parallel format:fix

      - name: Commit and push
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          default_author: github_actions
          message: 'chore: fix formatting'

      - name: Remove label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always()
        with:
          github-token: ${{ github.token }}
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'fix:formatting'
            })
