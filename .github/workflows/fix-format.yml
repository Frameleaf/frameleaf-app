# Automated branch commits are disabled; formatting is validated by read-only CI.
# No scheduled/event-driven mutations or foreign credentials are retained.
name: Fix formatting
"on":
  workflow_dispatch: null
permissions: {}
jobs:
  disabled:
    name: Legacy automation is disabled
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain the retired automation
        run:
          printf '%s\n' 'Automated branch commits are disabled; formatting is validated by read-only CI.' 'No external action
          was taken. Configure an owned replacement in a reviewed change before enabling automation.'
