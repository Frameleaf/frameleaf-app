name: Make Connect source
on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/make/**'
      - '.github/workflows/make-connect.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/make/**'
      - '.github/workflows/make-connect.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: make-connect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22.23.4', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --test integrations/make/test/*.test.mjs
      - run: bash .github/check-repository-hygiene.sh
