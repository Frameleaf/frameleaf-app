name: Static Code Analysis
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check what should run
        id: check
        uses: immich-app/devtools/actions/pre-job@91f342bb4477c4bc10c576ae739da875d85aa164 # pre-job-action-v2.0.4
        with:
          github-token: ${{ github.token }}
          filters: |
            mobile:
              - 'mobile/**'
              - 'i18n/en.json'
          force-filters: |
            - '.github/workflows/static_analysis.yml'
          force-events: 'workflow_dispatch,release'

  mobile-dart-analyze:
    name: Run Dart Code Analysis
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@4d97fb30d9edd3ff0d735f411f607a35204eea79 # use-mise-action-v3.2.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Install dependencies for UI package
        run: flutter pub get --enforce-lockfile
        working-directory: ./mobile/packages/ui

      - name: Perform codegen
        run: mise run --force //mobile:codegen

      - name: Run analyze
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "${DCM_CI_KEY:-}" ]; then
            mise //mobile:analyze
          elif [ "${REPO}" = "immich-app/immich" ]; then
            # Upstream repo requires DCM. If the secret is missing here we are
            # almost certainly looking at a rotated/expired key — fail loudly so
            # an operator sees it instead of silently downgrading lint coverage.
            echo "::error::DCM_CI_KEY is missing on upstream repository ${REPO}."
            echo "::error::Rotate the secret and re-run; refusing to fall back to dart-analyzer-only lint."
            exit 1
          else
            # Fork environment: no DCM license. Run only the bundled dart analyzer;
            # dcm is a commercial linter for style enforcement, not correctness.
            # We use `::warning::` (not `::notice::`) so the skip appears in the
            # PR annotation list and on the workflow run summary, making it
            # obvious if the secret silently disappears in a fork that previously
            # had it configured.
            echo "::warning title=DCM skipped::DCM_CI_KEY secret not configured for ${REPO}; running dart-analyzer only. This skips dcm style enforcement."
            mise //mobile:analyze:dart
          fi

      - name: Run format
        run: mise //mobile:format

      # TODO: Re-enable after upgrading custom_lint
      # - name: Run dart custom_lint
      #   run: dart run custom_lint
