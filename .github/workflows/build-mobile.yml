# Native signing and store identities are not configured. Unit tests and Dart analysis remain active in their CI workflows.
# No scheduled/event-driven mutations or foreign credentials are retained.
name: Build Mobile
"on":
  workflow_dispatch: null
permissions: {}
jobs:
  disabled:
    name: Legacy automation is disabled
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain the retired automation
        run:
          printf '%s\n' 'Native signing and store identities are not configured. Unit tests and Dart analysis remain active
          in their CI workflows.' 'No external action was taken. Configure an owned replacement in a reviewed change before
          enabling automation.'
