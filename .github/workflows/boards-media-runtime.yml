name: Boards media runtime
'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/**'
      - 'web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'licenses/media-downloader/**'
      - '.github/workflows/boards-media-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/**'
      - 'web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'licenses/media-downloader/**'
      - '.github/workflows/boards-media-runtime.yml'
permissions:
  contents: read
concurrency:
  group: boards-media-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Media runtime (${{ matrix.architecture }})
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure public Docker Hub mirror
        run: bash scripts/configure-dockerhub-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the candidate Library image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: server/Dockerfile
          target: prod
          load: true
          tags: frameleaf-media-test:${{ github.sha }}
          build-args: |
            NODE_IMAGE=mirror.gcr.io/library/node@sha256:8eb619e402eaede1748a3c8173bffab391592812e85136452f781741c7242ddf
            STUDIO_NODE_IMAGE=mirror.gcr.io/library/node@sha256:2bd396628eceb5c999a6e43731fab69d5fb98b94ba9d9d90b5f64575c5178765
          cache-from: type=registry,ref=ghcr.io/frameleaf/frameleaf-server-build-cache:ci-linux-${{ matrix.architecture }}
          secrets: mise_github_token=${{ github.token }}
      - name: Exercise bundled extraction, streams and sandbox with root and custom UID
        env:
          IMAGE: frameleaf-media-test:${{ github.sha }}
        run: |
          set -euo pipefail
          runtime=/opt/frameleaf-media-downloader
          fixture="$GITHUB_WORKSPACE/server/resources/media-downloader"
          for uid in 0 100123; do
            docker run --rm --pull never --network none --user "$uid:$uid" --entrypoint /bin/sh \
              --mount "type=bind,src=$fixture/test_bridge.py,dst=$runtime/test_bridge.py,readonly" \
              --mount "type=bind,src=$fixture/test_runtime.py,dst=$runtime/test_runtime.py,readonly" \
              --mount "type=bind,src=$fixture/fixture_extractors.py,dst=$runtime/fixture_extractors.py,readonly" \
              --mount "type=bind,src=$fixture/launcher_test.py,dst=$runtime/launcher_test.py,readonly" \
              "$IMAGE" -ec '
                runtime=/opt/frameleaf-media-downloader
                mkdir /tmp/flmd-bin
                ln -s "$runtime/launcher" /tmp/flmd-bin/frameleaf-media-test-launcher
                export PATH="/tmp/flmd-bin:$runtime/venv/bin:$PATH"
                cd "$runtime"
                python -B launcher_test.py "$runtime/launcher"
                python -B -m unittest test_bridge test_runtime
              '
          done
