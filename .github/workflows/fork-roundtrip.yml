name: Fork schema official-container certification

# Compatibility-target exception (FL-191): these lanes certify the handoff to and from the official
# server, so they pull its exact pinned image (OFFICIAL_IMMICH_TAG below, digest-checked by
# scripts/test-fork-roundtrip.sh). This is the only place Frameleaf CI pulls an upstream image; the
# database, the candidate server and everything a Frameleaf installation runs are Frameleaf-built.

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/fork-roundtrip.yml'
      - 'docker/postgres/**'
      - 'e2e/docker-compose.fork-roundtrip.yml'
      - 'e2e/src/specs/server/fork-schema-*.ts'
      - 'scripts/test-fork-roundtrip.sh'
      - 'scripts/test-fork-roundtrip.test.mjs'
      - 'server/Dockerfile'
      - 'server/base-image/**'
      - 'server/src/app.module.ts'
      - 'server/src/commands/**'
      - 'server/src/fork-schema/**'
      - 'server/src/repositories/**'
      - 'server/src/schema/**'
      - 'server/src/services/storage.service.ts'
      - 'server/src/services/storage-template.service.ts'
      - 'server/src/services/physical-deduplication.service.ts'
      - 'server/src/utils/database.ts'
  workflow_dispatch:
  # Nightly backstop against fork/main: catches cutover breakage introduced by
  # changes outside the path filter above.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-roundtrip
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  certify:
    if: >-
      ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    # The candidate image now compiles its own media libraries (FL-191), which adds to the build.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        lane:
          - origin-v3.1.0-to-fork
          - current-fork-to-official-v3.1.0
          - official-v3.1.0-to-fork-return
          - official-v3.1.0-to-fork-to-official-v3.1.0-to-fork
    env:
      FORK_ROUNDTRIP_LANE: ${{ matrix.lane }}
      FORK_ROUNDTRIP_EVIDENCE_DIR: ${{ github.workspace }}/fork-roundtrip-evidence
      GITHUB_TOKEN: ${{ github.token }}
      OFFICIAL_IMMICH_TAG: v3.1.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test certification restart handling
        run: node --test scripts/test-fork-roundtrip.test.mjs
      - name: Run real official-container certification lane
        run: pnpm --filter immich-e2e test:fork-roundtrip
      - name: Capture container evidence
        if: always()
        run: |
          docker compose -f e2e/docker-compose.fork-roundtrip.yml ps -a
          docker compose -f e2e/docker-compose.fork-roundtrip.yml logs --no-color > fork-roundtrip-${{ matrix.lane }}.log || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: fork-roundtrip-${{ matrix.lane }}
          # The evidence JSON names the candidate commit and image id and the certified official digest.
          path: |
            fork-roundtrip-${{ matrix.lane }}.log
            fork-roundtrip-evidence/
