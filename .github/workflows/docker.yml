name: Docker

on:
  push:
    branches: [fork/main]
  workflow_dispatch:

# Serialize candidate builds; do not cancel a partially published candidate.
concurrency:
  group: frameleaf-container-candidates
  cancel-in-progress: false

permissions: {}

jobs:
  integration:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-integration.yml
    permissions:
      contents: read

  certification:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-roundtrip.yml
    permissions:
      contents: read
      packages: read

  server:
    name: Build and Push Server
    needs: [integration, certification]
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-server
      context: .
      dockerfile: server/Dockerfile
      source-sha: ${{ github.sha }}
      platforms: linux/amd64,linux/arm64
      target: prod
      device: cpu

  machine-learning:
    name: Build and Push ML
    needs: [integration, certification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            suffix: ""
            platforms: linux/amd64,linux/arm64
            target: prod
          - device: cuda
            suffix: "-cuda"
            platforms: linux/amd64
            target: prod
          - device: cuda
            suffix: "-cuda-runpod"
            platforms: linux/amd64
            target: prod-runpod
          - device: openvino
            suffix: "-openvino"
            platforms: linux/amd64
            target: prod
          - device: armnn
            suffix: "-armnn"
            platforms: linux/arm64
            target: prod
          - device: rknn
            suffix: "-rknn"
            platforms: linux/arm64
            target: prod
          - device: rocm
            suffix: "-rocm"
            platforms: linux/amd64
            target: prod
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-machine-learning
      context: machine-learning
      dockerfile: machine-learning/Dockerfile
      source-sha: ${{ github.sha }}
      suffix: ${{ matrix.suffix }}
      platforms: ${{ matrix.platforms }}
      target: ${{ matrix.target }}
      device: ${{ matrix.device }}

  success-check-server:
    name: Docker Build & Push Server Success
    needs: [integration, certification, server]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require certified server publication
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  success-check-ml:
    name: Docker Build & Push ML Success
    needs: [integration, certification, machine-learning]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every certified ML variant
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
