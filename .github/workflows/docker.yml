name: Deploy

on:
  push:
    branches: [fork/main]
  workflow_dispatch:

# Serialize candidate builds; do not cancel a partially published candidate.
concurrency:
  group: frameleaf-container-candidates
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      machine-learning: ${{ steps.filter.outputs['machine-learning'] }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect image changes
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          server=false
          ml=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || ! "$BEFORE" =~ ^[0-9a-f]{40}$ || "$BEFORE" =~ ^0+$ ]]; then
            server=true
            ml=true
          else
            while IFS= read -r path; do
              case "$path" in
                .github/frameleaf-release.cjs|.github/workflows/docker.yml|.github/workflows/local-multi-runner-build.yml)
                  server=true
                  ml=true
                  ;;
                server/*|open-api/*|packages/*|web/*|i18n/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                  server=true
                  ;;
                machine-learning/*)
                  ml=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          echo "server=${server}" | tee -a "$GITHUB_OUTPUT"
          echo "machine-learning=${ml}" | tee -a "$GITHUB_OUTPUT"

  integration:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-integration.yml
    permissions:
      contents: read

  certification:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-roundtrip.yml
    permissions:
      contents: read
      packages: read

  server:
    name: Build and Push Server
    needs: [changes, integration, certification]
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-server
      context: .
      dockerfile: server/Dockerfile
      source-sha: ${{ github.sha }}
      platforms: linux/amd64,linux/arm64
      target: prod
      device: cpu

  retag-server:
    name: Re-Tag Server
    needs: [changes, integration, certification]
    if: needs.changes.outputs.server != 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag unchanged server candidate
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/frameleaf/frameleaf-server:commit-${GITHUB_SHA}" \
            "ghcr.io/frameleaf/frameleaf-server:latest"

  machine-learning:
    name: Build and Push ML
    needs: [changes, integration, certification]
    if: needs.changes.outputs['machine-learning'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            suffix: ''
            platforms: linux/amd64,linux/arm64
            target: prod
          - device: cuda
            suffix: '-cuda'
            platforms: linux/amd64
            target: prod
          - device: cuda
            suffix: '-cuda-runpod'
            platforms: linux/amd64
            target: prod-runpod
          - device: openvino
            suffix: '-openvino'
            platforms: linux/amd64
            target: prod
          - device: armnn
            suffix: '-armnn'
            platforms: linux/arm64
            target: prod
          - device: rknn
            suffix: '-rknn'
            platforms: linux/arm64
            target: prod
          - device: rocm
            suffix: '-rocm'
            platforms: linux/amd64
            target: prod
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-machine-learning
      context: machine-learning
      dockerfile: machine-learning/Dockerfile
      source-sha: ${{ github.sha }}
      suffix: ${{ matrix.suffix }}
      platforms: ${{ matrix.platforms }}
      target: ${{ matrix.target }}
      device: ${{ matrix.device }}

  retag-machine-learning:
    name: Re-Tag ML
    needs: [changes, integration, certification]
    if: needs.changes.outputs['machine-learning'] != 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        suffix:
          ['', '-cuda', '-cuda-runpod', '-openvino', '-armnn', '-rknn', '-rocm']
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag unchanged ML candidate
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/frameleaf/frameleaf-machine-learning:commit-${GITHUB_SHA}${SUFFIX}" \
            "ghcr.io/frameleaf/frameleaf-machine-learning:latest${SUFFIX}"

  success-check-server:
    name: Docker Build & Push Server Success
    needs: [integration, certification, server, retag-server]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require certified server publication
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e '.integration.result == "success" and .certification.result == "success" and ([.server.result, ."retag-server".result] | any(. == "success"))' <<< "$RESULTS"

  success-check-ml:
    name: Docker Build & Push ML Success
    needs:
      [integration, certification, machine-learning, retag-machine-learning]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every certified ML variant
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e '.integration.result == "success" and .certification.result == "success" and ([."machine-learning".result, ."retag-machine-learning".result] | any(. == "success"))' <<< "$RESULTS"
