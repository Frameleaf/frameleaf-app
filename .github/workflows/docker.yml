name: Deploy

on:
  push:
    branches: [fork/main]
  workflow_dispatch:

# Serialize candidate builds; do not cancel a partially published candidate.
concurrency:
  group: frameleaf-container-candidates
  cancel-in-progress: false

permissions: {}

jobs:
  changes:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      machine-learning: ${{ steps.filter.outputs['machine-learning'] }}
      server-release: ${{ steps.filter.outputs.server-release }}
      machine-learning-release: ${{ steps.filter.outputs.machine-learning-release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove unchanged qualified image inputs
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/frameleaf-release.cjs plan-reuse

  integration:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-integration.yml
    permissions:
      contents: read

  certification:
    if: github.repository == 'Frameleaf/frameleaf-app' && github.ref == 'refs/heads/fork/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/fork-roundtrip.yml
    permissions:
      contents: read
      packages: read

  server:
    name: Build and Push Server
    needs: [changes, integration, certification]
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-server
      context: .
      dockerfile: server/Dockerfile
      source-sha: ${{ github.sha }}
      platforms: linux/amd64,linux/arm64
      target: prod
      device: cpu

  retag-server:
    name: Re-Tag Server
    needs: [changes, integration, certification]
    if: needs.changes.outputs.server == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified unchanged candidate
        env:
          IMAGE: frameleaf-server
          SUFFIX: ''
          REUSE_RELEASE: ${{ needs.changes.outputs['server-release'] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/frameleaf-release.cjs reuse-candidate

  machine-learning:
    name: Build and Push ML
    needs: [changes, integration, certification]
    if: needs.changes.outputs['machine-learning'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            suffix: ''
            platforms: linux/amd64,linux/arm64
            target: prod
          - device: cuda
            suffix: '-cuda'
            platforms: linux/amd64
            target: prod
          - device: openvino
            suffix: '-openvino'
            platforms: linux/amd64
            target: prod
          - device: armnn
            suffix: '-armnn'
            platforms: linux/arm64
            target: prod
          - device: rknn
            suffix: '-rknn'
            platforms: linux/arm64
            target: prod
          - device: rocm
            suffix: '-rocm'
            platforms: linux/amd64
            target: prod
    uses: ./.github/workflows/local-multi-runner-build.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: frameleaf-machine-learning
      context: machine-learning
      dockerfile: machine-learning/Dockerfile
      source-sha: ${{ github.sha }}
      suffix: ${{ matrix.suffix }}
      platforms: ${{ matrix.platforms }}
      target: ${{ matrix.target }}
      device: ${{ matrix.device }}

  retag-machine-learning:
    name: Re-Tag ML
    needs: [changes, integration, certification]
    if: needs.changes.outputs['machine-learning'] == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        suffix:
          ['', '-cuda', '-openvino', '-armnn', '-rknn', '-rocm']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified unchanged candidate
        env:
          IMAGE: frameleaf-machine-learning
          SUFFIX: ${{ matrix.suffix }}
          REUSE_RELEASE: ${{ needs.changes.outputs['machine-learning-release'] }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/frameleaf-release.cjs reuse-candidate

  success-check-server:
    name: Docker Build & Push Server Success
    needs: [integration, certification, server, retag-server]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require certified server publication
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e '.integration.result == "success" and .certification.result == "success" and ([.server.result, ."retag-server".result] | any(. == "success"))' <<< "$RESULTS"

  success-check-ml:
    name: Docker Build & Push ML Success
    needs:
      [integration, certification, machine-learning, retag-machine-learning]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every certified ML variant
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e '.integration.result == "success" and .certification.result == "success" and ([."machine-learning".result, ."retag-machine-learning".result] | any(. == "success"))' <<< "$RESULTS"
