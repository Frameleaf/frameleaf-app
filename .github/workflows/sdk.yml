# Publishing the upstream @immich/sdk namespace is disabled; internal SDK generation remains required CI.
# No scheduled/event-driven mutations or foreign credentials are retained.
name: Update Immich SDK
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  disabled:
    name: Legacy automation is disabled
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain the retired automation
        run:
          printf '%s\n' 'Publishing the upstream @immich/sdk namespace is disabled; internal SDK generation remains required
          CI.' 'No external action was taken. Configure an owned replacement in a reviewed change before enabling automation.'
