name: PR Conventional Commit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel stale title-validation runs — only the latest PR title matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    if: >-
      ${{ github.repository == 'adamtaylor152/immich' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Validate PR Title (conventional commit) / validate-pr-title
    runs-on: [self-hosted, Linux, X64, aiimmich]
    permissions:
      pull-requests: write
    steps:
      - name: PR Conventional Commit Validation
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/') }}
        uses: ytanikin/PRConventionalCommits@b628c5a234cc32513014b7bfdd1e47b532124d98 # 1.3.0
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: 'false'
