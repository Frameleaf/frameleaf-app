name: Frameleaf Manager
on:
  pull_request:
    branches: [master/frameleaf-implementation, fork/main]
    paths:
      [
        "manager/**",
        ".github/verify-release-bundle*",
        ".github/verify-manager-release*",
        "packaging/nas/**",
        ".github/frameleaf-release.cjs",
        "docker/postgres/**",
        "docker/docker-compose*.yml",
        ".github/workflows/manager.yml",
        "server/src/*/frameleaf-library-setup*",
        "server/src/controllers/index*",
        "server/src/services/index.ts",
        "server/test/medium/specs/services/frameleaf-library-setup*",
        "open-api/**",
        "packages/sdk/**",
      ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only the tested Manager component and its latest aliases
        type: boolean
        default: false
      tag:
        description: Manager component version matching manager/package.json
        type: string
        default: manager-v0.1.0
permissions:
  contents: read
concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  manager:
    name: Manager (${{ matrix.architecture }})
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install independent Manager dependencies
        run: npm ci --prefix manager --ignore-scripts
      - name: Types and Svelte
        run: npm run check --prefix manager
      - name: Security, ownership, recovery and policy tests
        env:
          NODE_PATH: ${{ github.workspace }}/manager/node_modules
        run: npm test --prefix manager
      - name: Shared release verification and NAS packaging tests
        env:
          NODE_PATH: ${{ github.workspace }}/manager/node_modules
        run: node --test .github/verify-release-bundle.test.cjs packaging/nas/manager.test.cjs packaging/nas/build.test.cjs
      - name: Build standalone UI and API
        run: npm run build --prefix manager
      - name: Install browser for Manager interaction checks
        run: npx --prefix manager playwright install --with-deps chromium
      - name: Manager navigation, setup, maintenance and responsive interactions
        run: node manager/test/ui-browser.mjs
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: mkdir -p "$RUNNER_TEMP/manager"
      - name: Build Manager once without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          build-args: TARGETARCH=${{ matrix.architecture }}
          tags: frameleaf-manager:test
          push: false
          provenance: false
          outputs: |-
            type=oci,dest=${{ runner.temp }}/manager/image.tar,compression=gzip,force-compression=true
            type=docker,dest=${{ runner.temp }}/manager/runtime.tar
          labels: |-
            org.opencontainers.image.source=https://github.com/Frameleaf/frameleaf-app
            org.opencontainers.image.revision=${{ github.sha }}
      - run: docker load --input "$RUNNER_TEMP/manager/runtime.tar"
      - name: HTTPS claim, session and restart integration
        run: node manager/test/container.mjs
      - name: Build PostgreSQL from the owned pinned source
        run: docker build --build-arg TARGETARCH=${{ matrix.architecture }} --tag frameleaf-postgres:manager-test docker/postgres
      - name: Real disk PostgreSQL, encrypted Restic recovery and logical restore
        run: node manager/test/postgres-container.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: manager-evidence-${{ matrix.architecture }}
          path: |
            manager-evidence.json
            manager-postgres-evidence.json
          if-no-files-found: error
      - name: Bind both tested runtimes to their OCI bytes
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) [[ "$ARCHITECTURE" == amd64 ]] ;;
            aarch64) [[ "$ARCHITECTURE" == arm64 ]] ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/manager"
          mkdir "$archive/layout"
          tar -xf "$archive/image.tar" -C "$archive/layout"
          digest=$(jq -er '.manifests | select(length == 1) | .[0].digest' "$archive/layout/index.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          manifest="$archive/layout/blobs/sha256/${digest#sha256:}"
          [[ "sha256:$(sha256sum "$manifest" | cut -d' ' -f1)" == "$digest" ]]
          config=$(jq -er '.config.digest' "$manifest")
          config_file="$archive/layout/blobs/sha256/${config#sha256:}"
          [[ "sha256:$(sha256sum "$config_file" | cut -d' ' -f1)" == "$config" ]]
          jq -e --arg a "$ARCHITECTURE" '.architecture == $a and .os == "linux"' "$config_file" > /dev/null
          jq -e --arg s "$SOURCE_SHA" '.config.Labels["org.opencontainers.image.revision"]==$s' "$config_file" > /dev/null
          while read -r layer; do
            [[ "$layer" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "sha256:$(sha256sum "$archive/layout/blobs/sha256/${layer#sha256:}" | cut -d' ' -f1)" == "$layer" ]]
          done < <(jq -r '.layers[].digest' "$manifest")
          jq -e '[.layers[].mediaType] | all(. == "application/vnd.oci.image.layer.v1.tar+gzip")' "$manifest" > /dev/null
          jq -r '.layers[].digest' "$manifest" > "$archive/oci-layer-digests"
          jq -r '.rootfs.diff_ids[]' "$config_file" > "$archive/oci-diffids"
          [[ "$(wc -l < "$archive/oci-layer-digests")" == "$(wc -l < "$archive/oci-diffids")" ]]
          paste "$archive/oci-layer-digests" "$archive/oci-diffids" | while read -r layer diffid; do
            actual="sha256:$(gzip -dc "$archive/layout/blobs/sha256/${layer#sha256:}" | sha256sum | cut -d' ' -f1)"
            [[ "$actual" == "$diffid" ]]
          done
          docker load --input "$archive/runtime.tar"
          [[ "$(docker image inspect frameleaf-manager:test --format '{{.Id}}')" == "$config" ]]
          # Docker executes uncompressed layers: bind every ordered diffID to the OCI config.
          docker image inspect frameleaf-manager:test --format '{{json .RootFS.Layers}}' > "$archive/runtime-rootfs.json"
          jq -e --slurpfile runtime "$archive/runtime-rootfs.json" '.rootfs.diff_ids==$runtime[0]' "$config_file" > /dev/null
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const file of ['manager-evidence.json', 'manager-postgres-evidence.json']) {
            const evidence = JSON.parse(fs.readFileSync(file, 'utf8'));
            assert.equal(evidence.commit, process.env.SOURCE_SHA);
            assert(Object.keys(evidence.checks).length > 0);
            assert(Object.values(evidence.checks).every(value => value === 'passed'));
          }
          JS
          cd "$archive"
          sha256sum image.tar runtime.tar > SHA256SUMS
          jq -n --arg source "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg architecture "$ARCHITECTURE" \
            --slurpfile rootfs "$archive/runtime-rootfs.json" --arg digest "$digest" --arg config "$config" --arg archiveSha "$(sha256sum image.tar | cut -d' ' -f1)" \
            '{sourceCommit:$source,repository:$repository,runId:$run,runAttempt:$attempt,architecture:$architecture,
              digest:$digest,configDigest:$config,rootfsDiffIds:$rootfs[0],archiveSha256:$archiveSha,smoke:"passed"}' > receipt.json
          rm -rf layout
      - name: Retain tested Manager archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: manager-tested-${{ matrix.architecture }}
          path: ${{ runner.temp }}/manager/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    name: Manager Publish
    needs: manager
    environment: production
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' && github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/fork/main' || github.ref == 'refs/heads/master/frameleaf-implementation') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release commit is the current delivery branch
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit SHA."
            exit 1
          fi
          [[ "$RELEASE_TAG" == "manager-v$(jq -r .version manager/package.json)" ]]
          [[ "$RELEASE_TAG" =~ ^manager-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-manager-tag.json" 2> "$RUNNER_TEMP/manager-tag-error"; then
            echo '::error::Manager version tag already exists'; exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/manager-tag-error"
          git fetch --no-tags origin "$GITHUB_REF"
          branch_sha=$(git rev-parse FETCH_HEAD)
          head_sha=$(git rev-parse HEAD)
          if [[ "$branch_sha" != "$CANDIDATE_SHA" || "$head_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Manager publication requires the exact current selected delivery branch commit."
            exit 1
          fi
      - name: Download both qualified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manager-tested-*
          path: ${{ runner.temp }}/manager-archives
      - name: Install ORAS (checksum-pinned)
        run: .github/install-oras.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and publish only qualified digests
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |-
          set -euo pipefail
          image=ghcr.io/frameleaf/frameleaf-manager
          : "${COSIGN_PRIVATE_KEY:?Frameleaf production signing key is required}"
          : "${COSIGN_PASSWORD:?Frameleaf production signing password is required}"
          descriptors=()
          # Validate BOTH receipts before any registry write.
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/manager-archives/manager-tested-$architecture"
            (cd "$archive" && sha256sum -c SHA256SUMS)
            jq -e --arg source "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
              --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg a "$architecture" \
              --arg hash "$(sha256sum "$archive/image.tar" | cut -d' ' -f1)" \
              '.sourceCommit==$source and .repository==$repository and .runId==$run and .runAttempt==$attempt
               and .architecture==$a and .archiveSha256==$hash and .smoke=="passed"' "$archive/receipt.json" > /dev/null
            digest=$(jq -er .digest "$archive/receipt.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            mkdir "$archive/layout"
            tar -xf "$archive/image.tar" -C "$archive/layout"
            jq -e --arg d "$digest" '[.manifests[].digest] == [$d]' "$archive/layout/index.json" > /dev/null
            manifest="$archive/layout/blobs/sha256/${digest#sha256:}"
            [[ "sha256:$(sha256sum "$manifest" | cut -d' ' -f1)" == "$digest" ]]
            config=$(jq -er .config.digest "$manifest")
            [[ "$config" == "$(jq -er .configDigest "$archive/receipt.json")" ]]
            config_file="$archive/layout/blobs/sha256/${config#sha256:}"
            [[ "sha256:$(sha256sum "$config_file" | cut -d' ' -f1)" == "$config" ]]
            jq -e --arg a "$architecture" '.architecture==$a and .os=="linux"' "$config_file" > /dev/null
            jq -e --arg s "$SOURCE_SHA" --slurpfile receipt "$archive/receipt.json" \
              '.config.Labels["org.opencontainers.image.revision"]==$s and .rootfs.diff_ids==$receipt[0].rootfsDiffIds' \
              "$config_file" > /dev/null
            while read -r layer; do
              [[ "$layer" =~ ^sha256:[a-f0-9]{64}$ ]]
              [[ "sha256:$(sha256sum "$archive/layout/blobs/sha256/${layer#sha256:}" | cut -d' ' -f1)" == "$layer" ]]
            done < <(jq -r '.layers[].digest' "$manifest")
            descriptor="$RUNNER_TEMP/manager-$architecture-descriptor.json"
            jq -n --arg digest "$digest" --arg architecture "$architecture" --argjson size "$(wc -c < "$manifest")" \
              '{mediaType:"application/vnd.oci.image.manifest.v1+json",digest:$digest,size:$size,
                platform:{architecture:$architecture,os:"linux"}}' > "$descriptor"
            descriptors+=("$descriptor")
          done
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/manager-archives/manager-tested-$architecture"
            digest=$(jq -er .digest "$archive/receipt.json")
            oras cp --from-oci-layout "$archive/layout@$digest" "$image@$digest"
            [[ "$(oras resolve "$image@$digest")" == "$digest" ]]
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image@$digest"
            cosign verify --key cosign.pub "$image@$digest" > /dev/null
          done
          jq -s --arg source "$SOURCE_SHA" \
            '{schemaVersion:2,mediaType:"application/vnd.oci.image.index.v1+json",manifests:.,
              annotations:{"org.opencontainers.image.revision":$source,
                "org.opencontainers.image.source":"https://github.com/Frameleaf/frameleaf-app"}}' \
            "${descriptors[@]}" > "$RUNNER_TEMP/manager-index.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manager-index.json" | cut -d' ' -f1)"
          oras manifest push "$image@$digest" "$RUNNER_TEMP/manager-index.json"
          [[ "$(oras resolve "$image@$digest")" == "$digest" ]]
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image@$digest"
          cosign verify --key cosign.pub "$image@$digest" > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n --arg source "$SOURCE_SHA" --arg digest "$digest" --arg run "$GITHUB_RUN_ID" \
            --slurpfile amd64 "$RUNNER_TEMP/manager-archives/manager-tested-amd64/receipt.json" \
            --slurpfile arm64 "$RUNNER_TEMP/manager-archives/manager-tested-arm64/receipt.json" \
            '{schemaVersion:1,component:"frameleaf-manager",repository:"Frameleaf/frameleaf-app",tag:env.RELEASE_TAG,
              image:("ghcr.io/frameleaf/frameleaf-manager@"+$digest),sourceCommit:$source,
              buildRun:("https://github.com/Frameleaf/frameleaf-app/actions/runs/"+$run),
              architectures:[$amd64[0],$arm64[0]]}' \
            > "$RUNNER_TEMP/manager-manifest.json"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --type https://frameleaf.net/attestations/manager-release/v1 \
            --predicate "$RUNNER_TEMP/manager-manifest.json" "$image@$digest"
          cosign verify-attestation --key cosign.pub \
            --type https://frameleaf.net/attestations/manager-release/v1 "$image@$digest" > /dev/null
      - name: Attest published build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/frameleaf/frameleaf-manager
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Create the component release and latest aliases after signature and provenance
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF"
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          (cd "$RUNNER_TEMP" && sha256sum manager-manifest.json > SHA256SUMS)
          printf 'Standalone Frameleaf Manager %s. Image: ghcr.io/frameleaf/frameleaf-manager@%s\nOnly Manager is published from source %s. NAS installers consume the authenticated manifest and immutable digest.\n' "$RELEASE_TAG" "$DIGEST" "$SOURCE_SHA" > "$RUNNER_TEMP/manager-notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/manager-manifest.json" "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Frameleaf Manager $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/manager-notes.md" --latest=false
          oras tag "ghcr.io/frameleaf/frameleaf-manager@$DIGEST" "$RELEASE_TAG" latest
          [[ "$(oras resolve ghcr.io/frameleaf/frameleaf-manager:latest)" == "$DIGEST" ]]
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" > "$RUNNER_TEMP/latest-manager-tag.json" 2> "$RUNNER_TEMP/latest-tag-error"; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$SOURCE_SHA" -F force=true > /dev/null
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/latest-tag-error"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$SOURCE_SHA" > /dev/null
          fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq .object.sha)" == "$SOURCE_SHA" ]]
          oras logout ghcr.io
      - name: Retain publication binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: manager-publication
          path: ${{ runner.temp }}/manager-manifest.json
          if-no-files-found: error
