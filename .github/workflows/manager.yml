name: Frameleaf Manager
on:
  pull_request:
    branches: [master/frameleaf-implementation, fork/main]
    paths:
      [
        'manager/**',
        '.github/verify-release-bundle*',
        '.github/frameleaf-release.cjs',
        'docker/postgres/**',
        'docker/docker-compose*.yml',
        '.github/workflows/manager.yml',
        'server/src/*/frameleaf-library-setup*',
        'server/src/controllers/index*',
        'server/src/services/index.ts',
        'server/test/medium/specs/services/frameleaf-library-setup*',
        'open-api/**',
        'packages/sdk/**',
      ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Manager image from the exact current fork/main
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  manager:
    name: Manager (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            node-architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            node-architecture: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install independent Manager dependencies
        run: npm ci --prefix manager --ignore-scripts
      - name: Types and Svelte
        run: npm run check --prefix manager
      - name: Security, ownership, recovery and policy tests
        env:
          NODE_PATH: ${{ github.workspace }}/manager/node_modules
        run: npm test --prefix manager
      - name: Shared release verification tests
        env:
          NODE_PATH: ${{ github.workspace }}/manager/node_modules
        run: node --test .github/verify-release-bundle.test.cjs
      - name: Build standalone UI and API
        run: npm run build --prefix manager
      - name: Build Manager container without publishing
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          docker build --provenance=false --file manager/Dockerfile --build-arg TARGETARCH=${{ matrix.architecture }} \
            --label org.opencontainers.image.source=https://github.com/Frameleaf/frameleaf-app \
            --label org.opencontainers.image.revision="$SOURCE_SHA" --tag frameleaf-manager:test .
      - name: HTTPS claim, session and restart integration
        run: node manager/test/container.mjs
      - name: Build PostgreSQL from the owned pinned source
        run: docker build --build-arg TARGETARCH=${{ matrix.architecture }} --tag frameleaf-postgres:manager-test docker/postgres
      - name: Real disk PostgreSQL, encrypted Restic recovery and logical restore
        run: node manager/test/postgres-container.mjs
      - name: Archive the tested native image and receipt
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          NODE_ARCHITECTURE: ${{ matrix.node-architecture }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) [[ "$ARCHITECTURE" == amd64 ]] ;;
            aarch64) [[ "$ARCHITECTURE" == arm64 ]] ;;
            *) exit 1 ;;
          esac
          [[ "$(docker run --rm --network none --entrypoint node frameleaf-manager:test -p process.arch)" == "$NODE_ARCHITECTURE" ]]
          archive="$RUNNER_TEMP/manager"
          mkdir -p "$archive"
          docker image inspect frameleaf-manager:test > "$archive/image.json"
          jq -e --arg a "$ARCHITECTURE" --arg s "$SOURCE_SHA" \
            '.[0] | .Architecture==$a and .Os=="linux" and .Config.Labels["org.opencontainers.image.revision"]==$s' \
            "$archive/image.json" > /dev/null
          cp manager-evidence.json manager-postgres-evidence.json "$archive/"
          for evidence in "$archive/manager-evidence.json" "$archive/manager-postgres-evidence.json"; do
            jq -e --arg s "$SOURCE_SHA" --arg a "$NODE_ARCHITECTURE" \
              '.commit==$s and .architecture==$a and (.checks | length>0) and ([.checks[]] | all(.=="passed"))' \
              "$evidence" > /dev/null
          done
          docker save --output "$archive/image.tar" frameleaf-manager:test
          jq -n --arg source "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg architecture "$ARCHITECTURE" \
            --arg hash "$(sha256sum "$archive/image.tar" | cut -d' ' -f1)" --slurpfile image "$archive/image.json" \
            '{sourceCommit:$source,repository:$repository,runId:$run,runAttempt:$attempt,architecture:$architecture,
              archiveSha256:$hash,configDigest:$image[0][0].Id,rootfsDiffIds:$image[0][0].RootFS.Layers,
              integration:"passed",recovery:"passed"}' > "$archive/receipt.json"
          (cd "$archive" && sha256sum image.tar image.json manager-evidence.json manager-postgres-evidence.json > SHA256SUMS)
      - name: Retain tested image and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: manager-tested-${{ matrix.architecture }}
          path: ${{ runner.temp }}/manager/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: manager-evidence-${{ matrix.architecture }}
          path: |
            manager-evidence.json
            manager-postgres-evidence.json
          if-no-files-found: error
  publish:
    name: Manager Publish
    needs: manager
    environment: production
    if:
      ${{ github.repository == 'Frameleaf/frameleaf-app' && github.event_name == 'workflow_dispatch' &&
      inputs.publish && github.ref == 'refs/heads/fork/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release commit is the current delivery branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin refs/heads/fork/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Download both tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manager-tested-*
          path: ${{ runner.temp }}/manager-archives
      - name: Install ORAS (checksum-pinned)
        run: .github/install-oras.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify and publish only tested images
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          set -euo pipefail
          image=ghcr.io/frameleaf/frameleaf-manager
          : "${COSIGN_PRIVATE_KEY:?Frameleaf production signing key is required}"
          : "${COSIGN_PASSWORD:?Frameleaf production signing password is required}"
          # Validate BOTH native receipts and loaded image bytes before any registry write.
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/manager-archives/manager-tested-$architecture"
            (cd "$archive" && sha256sum -c SHA256SUMS)
            jq -e --arg source "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
              --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg a "$architecture" \
              --arg hash "$(sha256sum "$archive/image.tar" | cut -d' ' -f1)" \
              '.sourceCommit==$source and .repository==$repository and .runId==$run and .runAttempt==$attempt
               and .architecture==$a and .archiveSha256==$hash and .integration=="passed" and .recovery=="passed"' \
              "$archive/receipt.json" > /dev/null
            docker load --input "$archive/image.tar"
            docker image inspect frameleaf-manager:test | jq -e --arg a "$architecture" --arg s "$SOURCE_SHA" \
              --slurpfile receipt "$archive/receipt.json" \
              '.[0] | .Id==$receipt[0].configDigest and .RootFS.Layers==$receipt[0].rootfsDiffIds
               and .Architecture==$a and .Os=="linux" and .Config.Labels["org.opencontainers.image.revision"]==$s' > /dev/null
            docker tag frameleaf-manager:test "$image:tested-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$architecture"
          done
          git fetch --no-tags origin refs/heads/fork/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          descriptors=()
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/manager-archives/manager-tested-$architecture"
            candidate="$image:tested-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$architecture"
            docker push "$candidate"
            digest=$(oras resolve "$candidate")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            manifest="$RUNNER_TEMP/manager-$architecture-manifest.json"
            oras manifest fetch "$image@$digest" > "$manifest"
            [[ "sha256:$(sha256sum "$manifest" | cut -d' ' -f1)" == "$digest" ]]
            jq -e --slurpfile receipt "$archive/receipt.json" '.config.digest==$receipt[0].configDigest' "$manifest" > /dev/null
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image@$digest"
            cosign verify --key cosign.pub "$image@$digest" > /dev/null
            descriptor="$RUNNER_TEMP/manager-$architecture-descriptor.json"
            jq -n --arg digest "$digest" --arg architecture "$architecture" --argjson size "$(wc -c < "$manifest")" \
              --arg mediaType "$(jq -er .mediaType "$manifest")" \
              '{mediaType:$mediaType,digest:$digest,size:$size,platform:{architecture:$architecture,os:"linux"}}' > "$descriptor"
            descriptors+=("$descriptor")
          done
          jq -s --arg source "$SOURCE_SHA" \
            '{schemaVersion:2,mediaType:"application/vnd.oci.image.index.v1+json",manifests:.,
              annotations:{"org.opencontainers.image.revision":$source,
                "org.opencontainers.image.source":"https://github.com/Frameleaf/frameleaf-app"}}' \
            "${descriptors[@]}" > "$RUNNER_TEMP/manager-index.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manager-index.json" | cut -d' ' -f1)"
          oras manifest push "$image@$digest" "$RUNNER_TEMP/manager-index.json"
          [[ "$(oras resolve "$image@$digest")" == "$digest" ]]
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image@$digest"
          cosign verify --key cosign.pub "$image@$digest" > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n --arg source "$SOURCE_SHA" --arg digest "$digest" --arg run "$GITHUB_RUN_ID" \
            --slurpfile amd64 "$RUNNER_TEMP/manager-archives/manager-tested-amd64/receipt.json" \
            --slurpfile arm64 "$RUNNER_TEMP/manager-archives/manager-tested-arm64/receipt.json" \
            '{image:"ghcr.io/frameleaf/frameleaf-manager",digest:$digest,sourceCommit:$source,runId:$run,
              architectures:[$amd64[0],$arm64[0]]}' > "$RUNNER_TEMP/manager-publication.json"
      - name: Attest published build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/frameleaf/frameleaf-manager
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Update latest only after signature and provenance
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fork/main
          [[ "$(git rev-parse FETCH_HEAD)" == "$SOURCE_SHA" ]]
          oras tag "ghcr.io/frameleaf/frameleaf-manager@$DIGEST" latest
          [[ "$(oras resolve ghcr.io/frameleaf/frameleaf-manager:latest)" == "$DIGEST" ]]
          docker logout ghcr.io
      - name: Retain publication binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: manager-publication
          path: ${{ runner.temp }}/manager-publication.json
          if-no-files-found: error
