name: Frameleaf Release

# The Deploy workflow name identifies the certified candidate completion chain.
# This workflow owns version/release/latest promotion; Deploy creates candidates.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] API-verified same-repo Deploy run and exact current mainline SHA are required before checkout
    workflows: ['Deploy']
    branches: [fork/main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: frameleaf-release-promotion
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Tag and release
    if: >-
      ${{ github.repository == 'Frameleaf/frameleaf-app'
          && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fork/main')
              || (github.event_name == 'workflow_run'
                  && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
                  && github.event.workflow_run.conclusion == 'success'
                  && github.event.workflow_run.head_repository.full_name == github.repository
                  && github.event.workflow_run.head_branch == 'fork/main')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Verify exact mainline source and certified Docker run before checkout
        id: sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha : context.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid release SHA');
            const { data: branch } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/fork/main' });
            if (branch.object.sha !== sha) throw new Error('Stale release candidate: fork/main has moved');
            const trusted = (run) => run.head_sha === sha && run.head_branch === 'fork/main'
              && run.head_repository?.full_name === 'Frameleaf/frameleaf-app'
              && ['push', 'workflow_dispatch'].includes(run.event)
              && run.status === 'completed' && run.conclusion === 'success'
              && run.path === '.github/workflows/docker.yml';
            let run;
            if (context.eventName === 'workflow_run') {
              ({ data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.payload.workflow_run.id }));
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'docker.yml', head_sha: sha, per_page: 100,
              });
              run = runs.find(trusted);
            }
            if (!run || !trusted(run)) throw new Error('A successful same-SHA canonical Docker run is required, including integration and roundtrip certification');
            core.setOutput('sha', sha);
            core.setOutput('run', String(run.id));
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify all manifests, attach pinned installation files and promote
        env:
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
          CERTIFIED_RUN_ID: ${{ steps.sha.outputs.run }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/frameleaf-release.cjs release
