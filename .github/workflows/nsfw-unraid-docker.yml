name: NSFW Unraid Docker Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - fork/main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_TAG: fork-main-unraid
  ML_IMAGE_TAG: fork-main-unraid-openvino
  REGISTRY: ghcr.io
  IMAGE_OWNER: adamtaylor152
  SOURCE_REF: ${{ github.ref_name }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  certify-fork-roundtrip:
    name: Certify fork and official round trips
    uses: ./.github/workflows/fork-roundtrip.yml

  build-server:
    name: Build Server Image
    if: ${{ github.repository == 'adamtaylor152/immich' && github.ref_name == 'fork/main' }}
    needs: certify-fork-roundtrip
    # Docker-heavy fork image production runs on the local Unraid runner.
    # The deployment bundle packaging job below stays on GitHub-hosted runners.
    runs-on: [self-hosted, linux, x64, aiimmich, docker-build]
    permissions:
      contents: read
      packages: write
      # `id-token: write` is required for `docker/build-push-action` to mint
      # a GitHub OIDC token, which BuildKit uses to produce signed SLSA
      # provenance attestations alongside the `provenance: mode=min` metadata
      # embedded in the image manifest. Without this permission, the build
      # still succeeds but the provenance is unsigned BuildKit-embedded data
      # only — not the verifiable SLSA attestation chain Unraid consumers
      # need to validate `commit-<sha>` came from this exact workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify self-hosted runner tooling
        run: |
          set -euo pipefail
          docker version

      - name: Read reversion certification manifest
        id: certification
        run: |
          set -euo pipefail
          manifest="$(jq -c . server/src/fork-schema/supported-versions.json)"
          {
            echo "manifest=${manifest}"
            echo "official_tag=$(jq -r '.certifiedTags[0]' <<<"${manifest}")"
            echo "result=$(jq -r '.certification.result' <<<"${manifest}")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          # Consistent with local-multi-runner-build.yml: use the repository
          # owner identity (deterministic) instead of `github.actor` (varies by
          # whoever pushed the commit — Renovate, a contributor, etc.).
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          # SLSA provenance generation is enabled (defaults to `mode=max`) so
          # consumers can verify the build came from this repo + workflow. The
          # `mode=min` variant keeps attestation overhead small while preserving
          # the supply-chain attestation chain for Unraid users.
          provenance: mode=min
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-server:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-server:commit-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.immich.fork.reversion-supported=true
            org.immich.fork.certified-official-tag=${{ steps.certification.outputs.official_tag }}
            org.immich.fork.certification-result=${{ steps.certification.outputs.result }}
            org.immich.fork.supported-versions=${{ steps.certification.outputs.manifest }}
          secrets: |
            mise_github_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=unraid-docker
            BUILD_SOURCE_REF=${{ env.SOURCE_REF }}
            BUILD_SOURCE_COMMIT=${{ env.SOURCE_SHA }}
  build-machine-learning-openvino:
    name: Build OpenVINO ML Image
    if: ${{ github.repository == 'adamtaylor152/immich' && github.ref_name == 'fork/main' }}
    needs: certify-fork-roundtrip
    runs-on: [self-hosted, linux, x64, aiimmich, docker-build]
    permissions:
      contents: read
      packages: write
      # See build-server above: required for signed SLSA provenance via OIDC.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify self-hosted runner tooling
        run: |
          set -euo pipefail
          docker version

      - name: Read reversion certification manifest
        id: certification
        run: |
          set -euo pipefail
          manifest="$(jq -c . server/src/fork-schema/supported-versions.json)"
          {
            echo "manifest=${manifest}"
            echo "official_tag=$(jq -r '.certifiedTags[0]' <<<"${manifest}")"
            echo "result=$(jq -r '.certification.result' <<<"${manifest}")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          # Consistent with local-multi-runner-build.yml: use the repository
          # owner identity (deterministic) instead of `github.actor` (varies).
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OpenVINO machine learning
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: linux/amd64
          push: true
          # SLSA provenance generation enabled (mode=min keeps overhead small).
          provenance: mode=min
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-machine-learning:${{ env.ML_IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-machine-learning:commit-${{ env.SOURCE_SHA }}-openvino
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.immich.fork.reversion-supported=true
            org.immich.fork.certified-official-tag=${{ steps.certification.outputs.official_tag }}
            org.immich.fork.certification-result=${{ steps.certification.outputs.result }}
            org.immich.fork.supported-versions=${{ steps.certification.outputs.manifest }}
          build-args: |
            DEVICE=openvino
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=unraid-docker-openvino
            BUILD_SOURCE_REF=${{ env.SOURCE_REF }}
            BUILD_SOURCE_COMMIT=${{ env.SOURCE_SHA }}

  package-unraid-deployment:
    name: Package Unraid Compose Deployment
    needs:
      - build-server
      - build-machine-learning-openvino
    if: ${{ github.repository == 'adamtaylor152/immich' && github.ref_name == 'fork/main' }}
    runs-on: ubuntu-latest
    environment:
      name: unraid-docker
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Create deployment bundle
        run: |
          mkdir -p dist/unraid-docker
          cp docker/example.env dist/unraid-docker/example.env
          cp server/src/fork-schema/supported-versions.json dist/unraid-docker/supported-versions.json
          server_image="${REGISTRY}/${IMAGE_OWNER}/immich-server:${IMAGE_TAG}"
          ml_image="${REGISTRY}/${IMAGE_OWNER}/immich-machine-learning:${ML_IMAGE_TAG}"
          source_label="${SOURCE_REF}@${SOURCE_SHA}"

          jq -n \
            --arg source "${source_label}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --slurpfile manifest server/src/fork-schema/supported-versions.json \
            '{source: $source, certificationRun: $run, manifest: $manifest[0]}' \
            > dist/unraid-docker/fork-roundtrip-certification.json

          cat > dist/unraid-docker/docker-compose.yml <<'COMPOSE'
          name: immich

          services:
            immich-server:
              container_name: immich_server
              image: __SERVER_IMAGE__
              volumes:
                - ${UPLOAD_LOCATION}:/data
                - /etc/localtime:/etc/localtime:ro
              env_file:
                - .env
              ports:
                - '2283:2283'
              depends_on:
                - redis
                - database
              restart: always
              healthcheck:
                disable: false

            immich-machine-learning:
              container_name: immich_machine_learning
              image: __ML_IMAGE__
              device_cgroup_rules:
                - 'c 189:* rmw'
              devices:
                - /dev/dri:/dev/dri
              volumes:
                - model-cache:/cache
                - /dev/bus/usb:/dev/bus/usb
              env_file:
                - .env
              restart: always
              healthcheck:
                disable: false

            redis:
              container_name: immich_redis
              image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
              healthcheck:
                test: redis-cli ping || exit 1
              restart: always

            database:
              container_name: immich_postgres
              image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
              environment:
                POSTGRES_PASSWORD: ${DB_PASSWORD}
                POSTGRES_USER: ${DB_USERNAME}
                POSTGRES_DB: ${DB_DATABASE_NAME}
                POSTGRES_INITDB_ARGS: '--data-checksums'
              volumes:
                - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
              shm_size: 128mb
              restart: always
              healthcheck:
                disable: false

          volumes:
            model-cache:
          COMPOSE

          sed -i \
            -e "s#__SERVER_IMAGE__#${server_image}#g" \
            -e "s#__ML_IMAGE__#${ml_image}#g" \
            dist/unraid-docker/docker-compose.yml

          cat > dist/unraid-docker/README.md <<README
          # Immich NSFW Unraid Docker Deployment

          Built from \`${source_label}\`.

          Images:

          - \`${server_image}\`
          - \`${ml_image}\`

          Use the bundled \`docker-compose.yml\` with your existing Immich \`.env\` values. The machine-learning service is pinned to the OpenVINO image and maps \`/dev/dri\` for an Intel iGPU.

          \`supported-versions.json\` and \`fork-roundtrip-certification.json\` record the exact official compatibility manifest and the successful certification workflow required before these images were published.
          README

      - name: Upload deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-unraid-docker-${{ env.IMAGE_TAG }}
          path: dist/unraid-docker
