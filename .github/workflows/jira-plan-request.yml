name: Jira plan request

on:
  pull_request:
    types: [opened, edited, reopened, milestoned, demilestoned, closed]

permissions: {}

jobs:
  request:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Record PR metadata only
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('plan-event.json').write_text(json.dumps({
              'number': event['number'], 'changes': event.get('changes', {})}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jira-plan-request-${{ github.run_attempt }}
          path: plan-event.json
          retention-days: 7
          if-no-files-found: error
