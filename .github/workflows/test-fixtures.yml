name: Frameleaf frozen media fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'Frameleaf/frameleaf-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve the frozen attributed fixture source
        working-directory: .
        run: bash scripts/checkout-test-assets.sh
      - name: Archive the owned fixture input with checksums
        run: |
          mkdir -p "$RUNNER_TEMP/frameleaf-fixtures"
          tar --exclude=.git -czf "$RUNNER_TEMP/frameleaf-fixtures/frameleaf-test-assets-63a12e4f97e7a1ce54bb72ebd9fa5c2c812480bf.tar.gz" -C e2e/test-assets .
          cd "$RUNNER_TEMP/frameleaf-fixtures"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frameleaf-test-assets-63a12e4f97e7a1ce54bb72ebd9fa5c2c812480bf
          path: ${{ runner.temp }}/frameleaf-fixtures/
          if-no-files-found: error
          retention-days: 30
