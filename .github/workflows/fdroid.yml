# The inherited FUTO F-Droid destination is not owned Frameleaf infrastructure.
# No scheduled/event-driven mutations or foreign credentials are retained.
name: Update F-Droid Repo
'on':
  workflow_dispatch: null
permissions: {}
jobs:
  disabled:
    name: Legacy automation is disabled
    if: ${{ github.repository == 'Frameleaf/frameleaf-app' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Explain the retired automation
        run:
          printf '%s\n' 'The inherited FUTO F-Droid destination is not owned Frameleaf infrastructure.' 'No external action
          was taken. Configure an owned replacement in a reviewed change before enabling automation.'
