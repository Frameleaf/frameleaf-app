name: Fork Workflow Token
description: Resolve a workflow token using the GitHub App when configured, with a GITHUB_TOKEN fallback for fork-only environments.
inputs:
  github-token:
    description: Fallback token, usually github.token
    required: true
  app-client-id:
    description: Optional GitHub App client ID
    required: false
  app-private-key:
    description: Optional GitHub App private key
    required: false
outputs:
  token:
    description: Token for downstream workflow steps
    value: ${{ steps.app-token.outputs.token || steps.fallback.outputs.token }}
runs:
  using: composite
  steps:
    - id: app-token
      if: ${{ inputs.app-client-id != '' && inputs.app-private-key != '' }}
      uses: immich-app/devtools/actions/create-workflow-token@caa599d954228439ea3e8ce1c3328f41ab120ee6
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}

    - id: fallback
      if: ${{ inputs.app-client-id == '' || inputs.app-private-key == '' }}
      shell: bash
      run: echo "token=${{ inputs.github-token }}" >> "$GITHUB_OUTPUT"
