packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  better-sqlite3: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
  unrs-resolver: false
overrides:
  canvas: 3.2.3
  sharp: ^0.35.5
  brace-expansion@<2: ^1.1.13
  dompurify: ^3.4.17
  follow-redirects: ^1.16.1
  ip-address: ^10.7.4
  lodash-es: ^4.18.1
  node-forge: ^1.4.0
  qs: ^6.16.0
  serialize-javascript: ^7.1.2
  socket.io-parser: ^4.2.7
  svgo: ^3.3.5
  tar: ^7.5.22
  mermaid>uuid: ^11.1.1
packageExtensions:
  '@koddsson/eslint-plugin-tscompat':
    peerDependencies:
      typescript: '*'
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.1'
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@nestjs/platform-socket.io@12.1.3'
  - '@nestjs/schematics@12.0.7'
  - '@nestjs/testing@12.1.3'
  - '@nestjs/websockets@12.1.3'
  - '@testing-library/user-event@14.6.8'
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - dompurify@3.4.17
  - eslint-plugin-unicorn@78.0.0
  - postcss@8.5.30
  - typescript-eslint@8.71.2
  - vitest@5.0.4
  - zod@4.6.7
patchedDependencies:
  # Preserve registered roots, nullable unions and recursive tuple references with Zod 4.6.
  nestjs-zod@5.5.0: packages/patches/nestjs-zod@5.5.0.patch
  # Frameleaf Node ESM/CJS backport of https://github.com/porsager/postgres/pull/1168.
  'postgres@3.4.9': packages/patches/postgres@3.4.9.patch
  werift@0.25.0: packages/patches/werift@0.25.0.patch
  # Preserve the public API's existing default minute-only datetime precision.
  zod@4.6.7: packages/patches/zod@4.6.7.patch
