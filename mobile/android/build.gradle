allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')

    // Some plugins (home_widget 0.8.1) still compile Kotlin at jvmTarget 1.8 while their
    // androidx dependencies ship JVM 11+ bytecode, which fails on a clean Gradle cache.
    // Force every subproject onto the app's JVM 17 toolchain. Uses lazy configuration
    // (configureEach / plugins.withId) because evaluationDependsOn(':app') means some
    // projects are already evaluated when this block runs.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = '17'
    }
    // Plugin modules keep their own Java compileOptions (AGP convention mapping overrides
    // task-level JavaCompile settings), so Kotlin 17 vs Java 1.8 trips KGP's consistency
    // check; kotlin.jvm.target.validation.mode=warning in gradle.properties demotes it.
    // Java 1.8 bytecode alongside Kotlin 17 is fine at runtime (D8 desugars both).
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}
