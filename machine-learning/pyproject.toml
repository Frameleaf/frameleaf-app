[project]
name = "frameleaf-ml"
version = "1.1.16"
description = ""
authors = [{ name = "Hau Tran", email = "alex.tran1502@gmail.com" }]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "certifi>=2026.10.19",
    "aiocache>=0.12.3,<1.0",
    "fastapi>=0.143.0,<1.0",
    "gunicorn>=26.2.0",
    "huggingface-hub>=2.2.0,<3.0",
    "httpx2>=2.13.1,<3",
    "numpy>=2.5.4,<3.0",
    "onnx>=1.23.2",
    "opencv-python-headless>=5.0.0.93,<6.0",
    "orjson>=3.13.0",
    "pillow>=13.0.0,<14",
    "psutil>=5.9.7,<8.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<1.0",
    "rich>=15.0.0",
    "tokenizers>=0.23.3,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "rapidocr>=3.10.0",
    # Studio captions (owner decision 2026-10-09): Whisper through CTranslate2. See dependency-metadata.
    "faster-whisper==1.2.1",
    # Studio captions in other languages (FL-641): M2M100's SentencePiece tokenizer for CTranslate2.
    "sentencepiece>=0.2.0,<1.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
]
types = [
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "types-setuptools>=84.0.0.20261006",
    "types-simplejson>=4.2.0.20261006",
    "types-ujson>=5.10.0.20250822",
]
lint = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
    { include-group = "types" },
]
dev = ["locust>=2.46.7", { include-group = "test" }, { include-group = "lint" }]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.31.0,<2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
]
cuda = [
    # PyPI >=1.27 uses CUDA 13; the stable CUDA 12 feed ends at 1.29 (Pascal support).
    "onnxruntime-gpu==1.29.0",
    # TensorRT-RTX plugin provider for GeForce RTX cards (consumer GPUs); registered in sessions/ort.py.
    "onnxruntime-ep-nv-tensorrt-rtx-cu12>=0.4.0,<0.5 ; platform_machine == 'x86_64'",
    "qwen-vl-utils>=0.0.14,<1",
    "torch==2.14.1",
    # Qwen imports its video processor for still images, so Torchvision must match Torch.
    "torchvision==0.29.1",
    "transformers==5.19.0",
]
openvino = ["onnxruntime-openvino>=1.24.1,<2", "openvino-genai>=2026.4.1.0,<2027"]
armnn = ["onnxruntime>=1.31.0,<2"]
rknn = ["onnxruntime>=1.31.0,<2", "rknn-toolkit-lite2>=2.5.0,<3"]
rocm = ["onnxruntime-migraphx>=1.27.1,<2"]

[tool.uv]
compile-bytecode = true
# CPU and CUDA wheels are mutually exclusive; other device images keep their existing stacks.
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

# faster-whisper declares the plain `onnxruntime` wheel (for its Silero VAD), which would be installed
# over onnxruntime-gpu, -openvino or -migraphx and break those images. Every device extra already
# provides an `onnxruntime` module, which faster-whisper imports only when it filters silence, so its
# metadata is restated here without it.
[[tool.uv.dependency-metadata]]
name = "faster-whisper"
version = "1.2.1"
requires-dist = ["ctranslate2>=4.0,<5", "huggingface-hub>=0.21", "tokenizers>=0.13,<1", "av>=11", "tqdm"]

[tool.uv.sources]
onnxruntime-gpu = {index = "onnxruntime-cuda12", extra = "cuda"}
torch = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine in 'x86_64 aarch64'"},
    {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine in 'x86_64 aarch64'"},
]
torchvision = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' and platform_machine in 'x86_64 aarch64'"},
    {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine in 'x86_64 aarch64'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["frameleaf_ml"]

[tool.hatch.build.targets.wheel]
include = ["frameleaf_ml"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
plugins = "pydantic.mypy"
follow_imports = "silent"
warn_redundant_casts = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
per-file-ignores = { "test_main.py" = ["F403"] }

[tool.pytest.ini_options]
markers = ["providers", "ov_device_ids"]
