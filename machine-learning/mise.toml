[tools]
python = "3.12.15"
uv = "0.13.4"

[tasks.install]
run = "uv sync --locked"

[tasks.lint]
run = "uv run ruff check frameleaf_ml"

[tasks.test]
run = "uv run pytest --cov=frameleaf_ml --cov-report term-missing"

[tasks.format]
run = "uv run ruff format frameleaf_ml"

[tasks.check]
run = "uv run mypy --strict frameleaf_ml/"

[tasks.ci-unit]
run = [
  { task = ":install --extra cpu" },
  { task = ":format" },
  { task = ":lint --output-format=github" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]
