# Live app-testing stack (not the shared e2e stack). Own project, names, images and ports.
# docker compose -p frameleaf-live -f e2e/docker-compose.live.yml up --build -d --wait
name: frameleaf-live

services:
  immich-server:
    container_name: frameleaf-live-server
    image: frameleaf-live-server:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
      args:
        - BUILD_ID=1234567890
        - BUILD_IMAGE=live
        - BUILD_SOURCE_REF=live
        - BUILD_SOURCE_COMMIT=liveeeeeeeeeeeeeeeee
        # integration channel: trusts the local cloud's licence/plan keys via FRAMELEAF_LICENSE_EXTRA_JWKS_FILE
        - FRAMELEAF_BUILD_CHANNEL=integration
      secrets:
        - mise_github_token
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      FRAMELEAF_MACHINE_LEARNING_ENABLED: '${LIVE_ML_ENABLED:-false}'
      FRAMELEAF_MACHINE_LEARNING_URL: http://machine-learning:3003
      # testing = sign-in rate limits off (only effect); app agents sign in a lot
      FRAMELEAF_ENV: testing
      FRAMELEAF_CLOUD_URL: '${LIVE_CLOUD_URL:-http://frameleaf.127-0-0-1.nip.io:8080}'
      # passed through only when FRAMELEAF_LINK_TOKEN is set in the caller's env (single use)
      FRAMELEAF_LINK_TOKEN:
      FRAMELEAF_LICENSE_EXTRA_JWKS_FILE: /run/frameleaf/license-extra-jwks.json
      FRAMELEAF_PORT: '2283'
      # home-network address for GET /server/connections' local candidate (its port is used since 863e7e547c): loopback works for the iOS Simulator and for the emulator via adb reverse
      FRAMELEAF_LOCAL_URL: http://127.0.0.1:2290
      FRAMELEAF_IGNORE_MOUNT_CHECK_ERRORS: 'true'
      FRAMELEAF_SETUP_CODE: FRAMESTP
    extra_hosts:
      - 'frameleaf.localhost:host-gateway'
      - 'frameleaf.127-0-0-1.nip.io:host-gateway'
      - 'id.frameleaf.localhost:host-gateway'
      - 'id.frameleaf.127-0-0-1.nip.io:host-gateway'
      - 'api.frameleaf.localhost:host-gateway'
      - 'api.frameleaf.127-0-0-1.nip.io:host-gateway'
      - 'ml.eu.frameleaf.localhost:host-gateway'
      - 'ml.eu.frameleaf.127-0-0-1.nip.io:host-gateway'
      - 'ml.na.frameleaf.localhost:host-gateway'
      - 'ml.na.frameleaf.127-0-0-1.nip.io:host-gateway'
      - 'push.frameleaf.127-0-0-1.nip.io:host-gateway'
    volumes:
      - ./test-assets:/test-assets
      - live-upload:/data
      - '${LIVE_LICENSE_JWKS_FILE:-/dev/null}:/run/frameleaf/license-extra-jwks.json:ro'
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - 2290:2283
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:2283/api/server/ping >/dev/null']
      interval: 10s
      start_period: 180s
      retries: 30

  machine-learning:
    container_name: frameleaf-live-machine-learning
    image: frameleaf-live-machine-learning:latest
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      args:
        - DEVICE=cpu
    # hard cap so ML, not the server, is what gets OOM-killed when the Docker VM is tight
    mem_limit: 3g
    environment:
      MACHINE_LEARNING_WORKERS: '1'
      MACHINE_LEARNING_MODEL_TTL: '600'
    volumes:
      - live-model-cache:/cache
    profiles: [ml]

  redis:
    container_name: frameleaf-live-redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: frameleaf-live-postgres
    image: frameleaf-postgres:live
    build:
      context: ../docker/postgres
      dockerfile: Dockerfile
    command: -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      - live-pgdata:/var/lib/postgresql/data
    ports:
      - 5440:5432
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  live-model-cache:
  live-upload:
  live-pgdata:

secrets:
  mise_github_token:
    environment: GITHUB_TOKEN
