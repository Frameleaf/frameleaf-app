# FL-201: a fake Frameleaf Cloud (discovery, instance token, ML gateway) answering the vendored
# @frameleaf/cloud-contracts fixtures. Used only by `pnpm test:cloud`, after the main API run: it points
# the server at the fake, which the main run's specs (item-share) must not see.
services:
  frameleaf-cloud-fixture:
    image: node:24.21.0-trixie-slim@sha256:db3ae80f5d8df06e04dabdf7b44cbf008d32de168205fa0294444aabbc08c590
    command: node /fixture/frameleaf-cloud-fixture.mjs
    environment:
      FRAMELEAF_CLOUD_FIXTURE_PORT: '3010'
      FRAMELEAF_CLOUD_FIXTURE_URL: http://frameleaf-cloud-fixture:3010
    volumes:
      - ./src/fixtures/frameleaf-cloud-fixture.mjs:/fixture/frameleaf-cloud-fixture.mjs:ro
      - ./src/fixtures/frameleaf-cloud:/fixture/frameleaf-cloud:ro
    ports:
      - 3010:3010
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3010/ping').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 10

  immich-server:
    environment:
      FRAMELEAF_CLOUD_URL: http://frameleaf-cloud-fixture:3010
    depends_on:
      frameleaf-cloud-fixture:
        condition: service_healthy
