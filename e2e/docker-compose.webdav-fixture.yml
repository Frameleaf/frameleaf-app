# FL-944: a TEST-ONLY WebDAV server for `src/specs/server/api/import-webdav.e2e-spec.ts`. Written, not run yet.
#
# The server refuses every network its own container is attached to (a user must not reach the database
# or Redis), so this fixture is deliberately NOT reached over the Compose network: rclone publishes a port
# on the host and the server dials it through the Docker host gateway, which is a private address outside
# the server's own subnet, exactly like a NAS on the LAN. No test-only bypass exists in the guard.
#
# Start the WHOLE stack fresh with both files:
#   docker compose -f docker-compose.yml -f docker-compose.webdav-fixture.yml \
#     up -d --no-build --force-recreate --renew-anon-volumes --remove-orphans --wait
# then: FRAMELEAF_E2E_WEBDAV=1 pnpm test -- src/specs/server/api/import-webdav.e2e-spec.ts
services:
  webdav-fixture:
    image: rclone/rclone:1
    command:
      - serve
      - webdav
      - /data
      - --addr=:8080
      - --user=frameleaf
      - --pass=test-only-webdav-password
    tmpfs:
      - /data
    ports:
      - 2298:8080

  frameleaf-server:
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      webdav-fixture:
        condition: service_started
